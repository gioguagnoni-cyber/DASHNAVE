t); color:var(--red); }.empty { padding:28px 6px; color:var(--muted); text-align:center; font-size:12px; }.source { margin:15px 2px 0; color:#8794a6; font-size:10px; }.message { max-width:500px; margin:12vh auto; padding:26px; text-align:center; }.message h2 { font-size:18px; }.message p { color:var(--muted); }.retry { border:0; border-radius:8px; padding:8px 12px; background:var(--blue); color:#fff; font-weight:800; }.modal-backdrop { position:fixed; z-index:5; inset:0; background:#101b2a55; }.modal { position:fixed; z-index:6; top:50%; left:50%; width:min(740px,calc(100vw - 28px)); max-height:min(700px,calc(100vh - 28px)); overflow:auto; transform:translate(-50%,-50%); padding:23px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 22px 60px #17263d44; }.modal-close { position:absolute; top:12px; right:12px; width:31px; height:31px; border:0; border-radius:50%; background:#f0f3f8; color:#46566d; font-size:21px; line-height:1; }.detail-name { margin:4px 35px 3px 0; font-size:21px; letter-spacing:-.04em; }.detail-sub { margin:0 0 16px; color:var(--muted); font-size:12px; }.detail-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:19px; }.detail-metric { padding:10px; border-radius:10px; background:#f6f8fb; }.detail-metric span { display:block; color:var(--muted); font-size:10px; font-weight:700; }.detail-metric strong { display:block; margin-top:4px; font-size:14px; letter-spacing:-.03em; }
      .history-month { border-bottom:1px solid var(--line); }.history-month:last-child { border-bottom:0; }.month-btn { display:grid; width:100%; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; border:0; background:transparent; color:var(--ink); padding:12px 13px; text-align:left; }.month-btn:hover { background:#f8faff; }.month-btn span { display:grid; gap:2px; }.month-btn b { font-size:12px; }.month-btn small { color:var(--muted); font-size:10px; }.month-btn i { color:var(--blue); font-size:15px; font-style:normal; }.month-days { background:#fbfcfe; }.month-days .history-day { margin:0 9px; }.alert:has(.tag.alerta) { grid-template-columns:minmax(0,1fr) 58px; }.alert:has(.tag.alerta) .tag.alerta { display:none; }

    <main class="shell" id="app" aria-live="polite"><section class="message"><h2>Preparando a DASHFULL</h2><p>Conectando aos dados de performance…</p></section></main>
    <script>
      const SUPABASE_URL = "https://akffepitbqqqgldxvtlf.supabase.co";
      const SUPABASE_KEY = "sb_publishable_yEPQth9v7-mNr0tPavuQyw_yv9IkJbk";
      const DAILY_FIELDS = "di,date,campaign_id,label,suffix,niche,spend,cost,rev_adj,profit,roi,novos,rpm,status,qualidade,ciclo_vida,saude";
      const APP = document.getElementById("app");
      const RANGE_VALUES = new Set([3,5,7,14,30]);
      const readHash = () => { const params=new URLSearchParams(location.hash.slice(1)), start=params.get("ini")||"", end=params.get("fim")||"", range=Number(params.get("p")); return start&&end ? {range:7,start,end} : {range:RANGE_VALUES.has(range)?range:7,start:"",end:""}; };
      const initialHash = readHash();
      const state = { days: [], history: [], historyError: false, range: initialHash.range, start: initialHash.start, end: initialHash.end, data: null, query: "", expandedMonth: null, expandedDay: null, expandedCampaign: null, loadId: 0, insightsUnavailable: false };
      const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
      const money = value => new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL", maximumFractionDigits:0 }).format(number(value));
      const moneyPrecise = value => new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL", minimumFractionDigits:2, maximumFractionDigits:2 }).format(number(value));
      const pct = value => `${number(value)>0?"+":""}${number(value).toFixed(1)}%`;
      const date = value => value ? `${value.slice(8,10)}/${value.slice(5,7)}/${value.slice(2,4)}` : "—";
      const shortDate = value => date(value).slice(0,5);
      const monthLabel = value => { const label=new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric"}).format(new Date(`${value}T12:00:00`)); return label.charAt(0).toUpperCase()+label.slice(1); };
      const tone = value => number(value)>0 ? "positive" : number(value)<0 ? "negative" : "";
      const statusClass = value => value==="3 dias negativos" ? "alerta" : ["lucro","negativo","quase","aguardando","pausar","reduzir","escalar","investigar"].includes(value) ? value : "sem-status";
      const escape = value => String(value ?? "").replace(/[&<>'\"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"})[char]);
      const api = async (path, options={}, timeout=7000) => { const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),timeout); try { const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...options, signal:controller.signal, headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json", ...options.headers } }); if(!response.ok) throw new Error("Não foi possível carregar os dados."); return response.json(); } finally { clearTimeout(timer); } };
      const rpc = (name, body) => api(`rpc/${name}`, {method:"POST",body:JSON.stringify(body)},4500);
      function syncHash() { const params=new URLSearchParams(); if(state.start&&state.end) { params.set("ini",state.start);params.set("fim",state.end); } else params.set("p",String(state.range)); history.replaceState(null,"",`${location.pathname}${location.search}#${params}`); }
      const selectedDays = () => state.start && state.end ? state.days.filter(day => day.date>=state.start && day.date<=state.end) : state.days.slice(-state.range);
      const totals = rows => rows.reduce((all,row) => ({spend:all.spend+number(row.spend),cost:all.cost+number(row.cost),revenue:all.revenue+number(row.rev_adj),profit:all.profit+number(row.profit)}), {spend:0,cost:0,revenue:0,profit:0});
      const dailyRoi = row => { const cost=number(row.cost); return cost ? number(row.profit)/cost*100 : 0; };
      const roiWindow = (rows,end,requested) => { const picked=rows.filter(row => row.di<=end && row.di>=end-requested+1), all=totals(picked); return picked.length ? {roi:all.cost?all.profit/all.cost*100:null,coverage:new Set(picked.map(row=>row.di)).size,requested} : null; };
      function deriveDashboard(daily) {
        const groups=new Map();
        daily.forEach(row=>{ const group=groups.get(row.campaign_id)||{campaign_id:row.campaign_id,label:row.label,suffix:row.suffix,niche:row.niche,rows:[]}; group.rows.push(row); groups.set(row.campaign_id,group); });
        const alerts=[];
        const ranking=[...groups.values()].map(group=>{
          const rows=group.rows.slice().sort((a,b)=>number(a.di)-number(b.di)), all=totals(rows), roi=all.cost?all.profit/all.cost*100:0;
          const midpoint=Math.ceil(rows.length/2), first=totals(rows.slice(0,midpoint)), last=totals(rows.slice(midpoint));
          const firstRoi=first.cost?first.profit/first.cost*100:0, lastRoi=last.cost?last.profit/last.cost*100:0;
          const tendencia=rows.length<2?"indefinida":lastRoi-firstRoi>2?"subindo":firstRoi-lastRoi>2?"caindo":"estável";
          const recomendacao=all.cost>=150&&roi<0?"pausar":all.cost>=150&&roi>=20?"escalar":"acompanhar";
          let streak=[];
          rows.forEach(row=>{ if(number(row.cost)>0&&dailyRoi(row)<0){ streak=streak.length&&number(row.di)===number(streak.at(-1).di)+1?[...streak,row]:[row]; } else streak=[]; });
          if(streak.length>=3){ const lastThree=streak.slice(-3), impact=Math.abs(lastThree.reduce((sum,row)=>sum+number(row.profit),0)); alerts.push({campaign_id:group.campaign_id,label:group.label,tipo:"3 dias negativos",prioridade:0,impacto:impact,detalhe:"ROI negativo, três dias consecutivos."}); }
          return {campaign_id:group.campaign_id,label:group.label,suffix:group.suffix,niche:group.niche,spend:all.spend,cost:all.cost,rev_adj:all.revenue,profit:all.profit,roi,tendencia,recomendacao};
        }).sort((a,b)=>number(b.profit)-number(a.profit));
        const portfolio=totals(daily);
        return {summary:{portfolio:{spend:portfolio.spend,cost:portfolio.cost,rev_adj:portfolio.revenue,profit:portfolio.profit,roi:portfolio.cost?portfolio.profit/portfolio.cost*100:0,campanhas:groups.size}},ranking,alerts,clientAlerts:alerts,quality:{dias_parciais:state.days.filter(day=>day.badge==="parcial").map(day=>date(day.date)),inconsistentes:daily.filter(row=>row.qualidade==="inconsistente").length,suspeitos:daily.filter(row=>row.qualidade==="suspeito").length},daily};
      }
      function aggregate(rows) { const grouped=new Map(); rows.forEach(row => { const current=grouped.get(row.di)||{di:row.di,date:row.date,spend:0,rev:0,profit:0}; current.spend+=number(row.spend); current.rev+=number(row.rev_adj); current.profit+=number(row.profit); grouped.set(row.di,current); }); return [...grouped.values()].sort((a,b)=>a.di-b.di); }
      function chart(rows) { const points=aggregate(rows); if(!points.length) return '<div class="empty">Não há resultado diário neste período.</div>'; const w=720,h=245,p={t:14,r:14,b:29,l:14},iw=w-p.l-p.r,ih=h-p.t-p.b; const high=Math.max(...points.flatMap(row=>[row.spend,row.rev]),1),lowProfit=Math.min(0,...points.map(row=>row.profit)),highProfit=Math.max(0,...points.map(row=>row.profit)),span=highProfit-lowProfit||1; const x=i=>p.l+(points.length===1?iw/2:i/(points.length-1)*iw),y=v=>p.t+ih-v/high*ih,py=v=>p.t+ih-(v-lowProfit)/span*ih,bw=Math.max(5,Math.min(15,iw/points.length*.31)),every=Math.max(1,Math.ceil(points.length/6)); const bars=points.map((row,i)=>`<g><rect x="${x(i)-bw-1}" y="${y(row.spend)}" width="${bw}" height="${Math.max(0,p.t+ih-y(row.spend))}" rx="2" fill="#bfd0f7"/><rect x="${x(i)+1}" y="${y(row.rev)}" width="${bw}" height="${Math.max(0,p.t+ih-y(row.rev))}" rx="2" fill="#84ceb4"/>${(i%every===0||i===points.length-1)?`<text class="axis" x="${x(i)}" y="${h-8}" text-anchor="middle">${shortDate(row.date)}</text>`:""}</g>`).join(""); const line=points.map((row,i)=>`${x(i)},${py(row.profit)}`).join(" "); const dots=points.map((row,i)=>`<circle cx="${x(i)}" cy="${py(row.profit)}" r="2.7" fill="#245dd8"/>`).join(""); return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolução diária de gasto, receita e lucro"><line x1="${p.l}" x2="${w-p.r}" y1="${py(0)}" y2="${py(0)}" stroke="#dfe5ed" stroke-dasharray="3 4"/>${bars}<polyline fill="none" points="${line}" stroke="#245dd8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`; }
      const compare = (label,value) => `<div class="comparison"><span>${label}</span><strong class="${tone(value?.roi)}">${!value?"Não rodou":value.roi===null?"Sem custo":pct(value.roi)}</strong>${value&&value.coverage<value.requested?`<small>${value.coverage}/${value.requested} dias com dados</small>`:""}</div>`;
      function historyMarkup() { if(!state.history.length) return `<aside class="history"><div class="history-head"><div><p class="eyebrow">HISTÓRICO COMPLETO</p><h2>Campanhas por mês</h2><p>Escolha um mês para visualizar os dias.</p></div><span>…</span></div><div class="history-state">${state.historyError?"O histórico não pôde ser carregado.<br><button data-retry-history>Tentar novamente</button>":"Carregando o histórico diário…"}</div></aside>`; const daysWithCampaigns=state.days.map(day=>({...day,campaigns:state.history.filter(row=>row.di===day.di).sort((a,b)=>String(a.label).localeCompare(String(b.label),"pt-BR"))})).filter(day=>day.campaigns.length),months=new Map(); daysWithCampaigns.forEach(day=>{ const key=day.date.slice(0,7),group=months.get(key)||{key,label:monthLabel(`${key}-01`),days:[]}; group.days.push(day);months.set(key,group); }); const groups=[...months.values()].reverse(); return `<aside class="history" aria-label="Histórico mensal de campanhas"><div class="history-head"><div><p class="eyebrow">HISTÓRICO COMPLETO</p><h2>Campanhas por mês</h2><p>Escolha um mês para visualizar os dias.</p></div><span>${groups.length} ${groups.length===1?"mês":"meses"}</span></div><div class="history-days">${groups.map(month=>{ const open=state.expandedMonth===month.key; return `<section class="history-month"><button class="month-btn" data-history-month="${month.key}" aria-expanded="${open}"><span><b>${escape(month.label)}</b><small>${month.days.length} ${month.days.length===1?"dia com campanhas":"dias com campanhas"}</small></span><i>${open?"−":"+"}</i></button>${open?`<div class="month-days">${month.days.map(day=>{ const dayOpen=state.expandedDay===day.di; return `<section class="history-day"><button class="day-btn" data-history-day="${day.di}" aria-expanded="${dayOpen}"><span><b>${date(day.date)}</b><small>${day.campaigns.length} campanhas</small></span><span><i>${dayOpen?"−":"+"}</i></span></button>${dayOpen?`<div class="campaigns">${day.campaigns.map(row=>campaignMarkup(row)).join("")}</div>`:""}</section>`; }).join("")}</div>`:""}</section>`; }).join("")}</div></aside>`; }
      function campaignMarkup(row) { const key=`${row.di}:${row.campaign_id}`,open=state.expandedCampaign===key,roi=dailyRoi(row); return `<div class="campaign-row"><button class="campaign-btn" data-history-campaign="${row.di}:${row.campaign_id}" aria-expanded="${open}"><span>${escape(row.label)}</span><strong class="${tone(roi)}">${pct(roi)}</strong><i>${open?"−":"+"}</i></button>${open?campaignDetails(row):""}</div>`; }
      function campaignDetails(row) { const rows=state.history.filter(item=>item.campaign_id===row.campaign_id).sort((a,b)=>a.di-b.di),roi=dailyRoi(row); return `<div class="campaign-detail"><div class="daily-metrics"><div><span>Gasto</span><strong>${moneyPrecise(row.spend)}</strong></div><div><span>Receita</span><strong>${moneyPrecise(row.rev_adj)}</strong></div><div><span>Lucro</span><strong class="${tone(row.profit)}">${moneyPrecise(row.profit)}</strong></div><div><span>ROI</span><strong class="${tone(roi)}">${pct(roi)}</strong></div><div class="status"><span>Status</span><strong><i class="dot ${statusClass(row.status)}"></i>${escape(row.status||"sem status")}</strong></div></div><div class="comparisons">${compare("Dia",roiWindow(rows,row.di,1))}${compare("Ontem",roiWindow(rows,row.di-1,1))}${compare("D-2",roiWindow(rows,row.di-2,1))}${compare("Últimos 7",roiWindow(rows,row.di,7))}${compare("Últimos 14",roiWindow(rows,row.di,14))}</div><div class="history-list-title"><span>Histórico completo</span><b>${rows.length} dias</b></div><div class="mini-history">${rows.map(item=>`<div><span>${shortDate(item.date)}</span><span>${moneyPrecise(item.spend)}</span><strong class="${tone(dailyRoi(item))}">${pct(dailyRoi(item))}</strong><em>${escape(item.status||"sem status")}</em></div>`).join("")}</div><button class="open-history" data-open-history="${row.campaign_id}">Abrir tabela completa</button></div>`; }
      function render() {
        const days=selectedDays(), data=state.data, loading=!data;
        if(!state.days.length) { APP.innerHTML='<section class="message"><h2>Não há dias disponíveis</h2><p>Verifique os dados cadastrados no Supabase.</p></section>'; return; }
        const all=data?.daily||[], fallback=totals(all), portfolio=data?.summary?.portfolio||{};
        const metrics={spend:number(portfolio.spend||fallback.spend),cost:number(portfolio.cost||fallback.cost),revenue:number(portfolio.rev_adj||fallback.revenue),profit:number(portfolio.profit||fallback.profit),roi:number(portfolio.roi??(fallback.cost?fallback.profit/fallback.cost*100:0))};
        const count=number(portfolio.campanhas)||new Set(all.map(row=>row.campaign_id)).size;
        const quality=data?.quality||{}, partial=quality.dias_parciais||[];
        const qualityCounts=number(quality.inconsistentes)+number(quality.suspeitos);
        const alerts=(data?.alerts||[]).slice().sort((a,b)=>number(a.prioridade)-number(b.prioridade)||number(b.impacto)-number(a.impacto)).slice(0,7);
        const ranking=(data?.ranking||[]).filter(row=>!state.query||`${row.label} ${row.suffix||""} ${row.niche||""}`.toLocaleLowerCase("pt-BR").includes(state.query.toLocaleLowerCase("pt-BR")));
        const range=days.length?`${date(days[0].date)} → ${date(days.at(-1).date)}`:"Sem data disponível";
        const partialNotice=partial.length?`<div class="notice"><b>⚠</b><span><b>Dados parciais:</b> ${partial.map(escape).join(", ")}. Decisões deste período merecem conferência adicional.</span></div>`:"";
        const qualityNotice=qualityCounts?`<div class="notice notice-info"><b>i</b><span><b>Qualidade dos dados:</b> ${number(quality.inconsistentes)} inconsistência(s) e ${number(quality.suspeitos)} registro(s) suspeito(s) no período.</span></div>`:"";
        const insightNote=state.insightsUnavailable?'<p class="insight-note">Os indicadores avançados estão temporariamente indisponíveis; os KPIs, o histórico e os cálculos do período continuam atualizados.</p>':"";
        APP.innerHTML=`<header class="topbar"><div class="brand"><div class="mark">Df</div><div><p class="eyebrow">DIZZ 1 WAVE</p><h1>DASHFULL</h1><p class="subtitle">Performance diária, com decisões claras.</p></div></div><span class="public">Painel público</span></header><section class="filters" aria-label="Filtros de período"><span class="filter-label">Período do painel</span><div class="ranges">${[3,5,7,14,30].map(value=>`<button data-range="${value}" class="${!state.start&&state.range===value?"active":""}">${value} dias</button>`).join("")}</div><div class="dates"><label>De <input id="start" type="date" min="${state.days[0].date}" max="${state.days.at(-1).date}" value="${state.start}" /></label><label>Até <input id="end" type="date" min="${state.days[0].date}" max="${state.days.at(-1).date}" value="${state.end}" /></label></div></section><div class="workspace">${historyMarkup()}<div class="main"><p class="context"><strong>${range}</strong><span class="separator">•</span><span>${days.length} ${days.length===1?"dia com dados":"dias com dados"}</span>${loading?'<span class="separator">•</span><span>Atualizando…</span>':""}</p>${partialNotice}${qualityNotice}${insightNote}<section class="metrics"><article class="metric"><div class="metric-label">Gasto total</div><div class="metric-value">${money(metrics.spend)}</div><div class="metric-foot">${count} campanhas com resultado</div></article><article class="metric"><div class="metric-label">Receita líquida</div><div class="metric-value positive">${money(metrics.revenue)}</div><div class="metric-foot">Após os ajustes de receita aplicados</div></article><article class="metric"><div class="metric-label">Lucro</div><div class="metric-value ${tone(metrics.profit)}">${money(metrics.profit)}</div><div class="metric-foot">Custo total: ${money(metrics.cost)}</div></article><article class="metric"><div class="metric-label">ROI</div><div class="metric-value ${tone(metrics.roi)}">${pct(metrics.roi)}</div><div class="metric-foot">Retorno sobre o custo total</div></article></section><section class="content"><article class="panel"><div class="panel-head"><div><h2>Evolução diária</h2><p>Gasto e receita em barras; lucro em linha.</p></div><div class="legend"><span><i style="background:#bfd0f7"></i>Gasto</span><span><i style="background:#84ceb4"></i>Receita</span><span><i style="background:#245dd8"></i>Lucro</span></div></div><div class="chart">${chart(all)}</div></article><article class="panel"><div class="panel-head"><div><h2>Agir agora</h2><p>Sugestões ordenadas por impacto financeiro.</p></div></div><div class="alerts">${alerts.length?alerts.map(alert=>`<button type="button" class="alert" data-campaign="${alert.campaign_id}"><span class="tag ${statusClass(alert.tipo)}">${escape(alert.tipo)}</span><span><span class="alert-title">${escape(alert.label)}</span><span class="alert-detail">${escape(alert.detalhe)}</span></span><span class="impact ${tone(alert.impacto)}"><small>Impacto</small>${money(alert.impacto)}</span></button>`).join(""):'<div class="empty">Nenhuma ação pendente neste período.</div>'}</div></article></section><section class="panel table-panel"><div class="panel-head"><div><h2>Ranking de campanhas</h2><p>Este detalhe respeita o período filtrado no painel.</p></div><div class="table-tools"><input id="search" value="${escape(state.query)}" placeholder="Buscar campanha, nicho ou código" aria-label="Buscar campanha" /></div></div><div class="scroller"><table><thead><tr><th>Campanha</th><th>Gasto</th><th>Receita líq.</th><th>Lucro</th><th>ROI</th><th>Tendência</th><th>Ação</th></tr></thead><tbody>${ranking.length?ranking.map(row=>{const recommendation=String(row.recomendacao||"acompanhar"),trend=String(row.tendencia||"indefinida");return `<tr data-campaign="${row.campaign_id}"><td class="campaign">${escape(row.label)}</td><td>${moneyPrecise(row.spend)}</td><td>${moneyPrecise(row.rev_adj)}</td><td class="${tone(row.profit)}">${moneyPrecise(row.profit)}</td><td class="${tone(row.roi)}">${pct(row.roi)}</td><td class="trend">${trend==="subindo"?"↑":trend==="caindo"?"↓":"→"} ${escape(trend)}</td><td><span class="reco ${statusClass(recommendation)}">${escape(recommendation.replaceAll("_"," "))}</span></td></tr>`;}).join(""):'<tr><td colspan="7"><div class="empty">Nenhuma campanha encontrada neste período.</div></td></tr>'}</tbody></table></div></section><p class="source">Dados consolidados do Supabase. O painel principal usa resultados diários; alertas e ranking avançado são enriquecidos sem bloquear a visualização.</p></div></div>`;
        bind();
      }
      function bind() {
        document.querySelectorAll("[data-range]").forEach(button=>button.addEventListener("click",()=>{ state.range=Number(button.dataset.range);state.start="";state.end="";syncHash();load(); }));
        ["start","end"].forEach(id=>document.getElementById(id)?.addEventListener("change",event=>{ state[id]=event.target.value; if(state.start&&state.end) { if(state.start>state.end) [state.start,state.end]=[state.end,state.start]; syncHash();load(); } else { syncHash();render(); } }));
        document.getElementById("search")?.addEventListener("input",event=>{ state.query=event.target.value;render(); });
        document.querySelectorAll("[data-history-month]").forEach(button=>button.addEventListener("click",()=>{ const month=button.dataset.historyMonth;state.expandedMonth=state.expandedMonth===month?null:month;state.expandedDay=null;state.expandedCampaign=null;render(); }));
        document.querySelectorAll("[data-history-day]").forEach(button=>button.addEventListener("click",()=>{ const di=Number(button.dataset.historyDay);state.expandedDay=state.expandedDay===di?null:di;state.expandedCampaign=null;render(); }));
        document.querySelectorAll("[data-history-campaign]").forEach(button=>button.addEventListener("click",()=>{ const key=button.dataset.historyCampaign;state.expandedCampaign=state.expandedCampaign===key?null:key;render(); }));
        document.querySelectorAll("[data-open-history]").forEach(button=>button.addEventListener("click",()=>showCampaign(Number(button.dataset.openHistory),true)));
        document.querySelectorAll("[data-campaign]").forEach(row=>row.addEventListener("click",()=>showCampaign(Number(row.dataset.campaign),false)));
        document.querySelector("[data-retry-history]")?.addEventListener("click",loadHistory);
      }
      function showCampaign(id,full) {
        const source=full?state.history:(state.data?.daily||[]),rows=source.filter(row=>Number(row.campaign_id)===id).sort((a,b)=>number(a.di)-number(b.di));
        if(!rows.length)return;
        const campaign=(state.data?.ranking||[]).find(row=>Number(row.campaign_id)===id)||rows[0],all=totals(rows),roi=all.cost?all.profit/all.cost*100:0,modal=document.createElement("div");
        modal.innerHTML=`<div class="modal-backdrop"></div><section class="modal" role="dialog" aria-modal="true" aria-label="Detalhe da campanha"><button class="modal-close" aria-label="Fechar">×</button><p class="eyebrow">${full?"HISTÓRICO COMPLETO":"PERÍODO SELECIONADO"}</p><h2 class="detail-name">${escape(campaign.label)}</h2><p class="detail-sub">${rows.length} dias com resultado</p><div class="detail-metrics"><div class="detail-metric"><span>Gasto</span><strong>${money(all.spend)}</strong></div><div class="detail-metric"><span>Receita líquida</span><strong>${money(all.revenue)}</strong></div><div class="detail-metric"><span>Lucro</span><strong class="${tone(all.profit)}">${money(all.profit)}</strong></div><div class="detail-metric"><span>ROI</span><strong class="${tone(roi)}">${pct(roi)}</strong></div></div><div class="scroller"><table><thead><tr><th>Data</th><th>Gasto</th><th>Rec. líq.</th><th>Lucro</th><th>ROI</th><th>Status</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${date(row.date)}</td><td>${moneyPrecise(row.spend)}</td><td>${moneyPrecise(row.rev_adj)}</td><td class="${tone(row.profit)}">${moneyPrecise(row.profit)}</td><td class="${tone(dailyRoi(row))}">${pct(dailyRoi(row))}</td><td><span class="drawer-status"><i class="dot ${statusClass(row.status)}"></i>${escape(row.status||"sem status")}</span></td></tr>`).join("")}</tbody></table></div></section>`;
        document.body.append(modal);
        const close=()=>{ document.removeEventListener("keydown",onKeyDown);modal.remove(); };
        const onKeyDown=event=>{ if(event.key==="Escape") close(); };
        modal.querySelector(".modal-close").addEventListener("click",close);
        modal.querySelector(".modal-backdrop").addEventListener("click",close);
        document.addEventListener("keydown",onKeyDown);
        modal.querySelector(".modal-close").focus();

      async function loadHistory() { state.historyError=false; try { state.history=await api(`v_daily?typ=eq.msgs&select=${DAILY_FIELDS}&order=di.asc`); } catch { state.historyError=true; } render(); }
      async function enrichDashboard(first,last,requestId) {
        const results=await Promise.allSettled([
          rpc("campaign_ranking",{di_ini:first,di_fim:last,min_spend:150,roi_meta:20,exclude_prefix:null}),
          rpc("operational_alerts",{di_ini:first,di_fim:last,min_spend:150,roi_meta:20}),
          rpc("data_quality_status",{di_ini:first,di_fim:last})

        const [rankingResult,alertsResult,qualityResult]=results, current=state.data;
        const ranking=rankingResult.status==="fulfilled"&&Array.isArray(rankingResult.value)?rankingResult.value:current.ranking;
        const serverAlerts=alertsResult.status==="fulfilled"&&Array.isArray(alertsResult.value)?alertsResult.value:[];
        const alertsByKey=new Map([...(current.clientAlerts||[]),...serverAlerts].map(alert=>[`${alert.campaign_id}:${alert.tipo}`,alert]));
        const quality=qualityResult.status==="fulfilled"&&qualityResult.value&&typeof qualityResult.value==="object"?{...current.quality,...qualityResult.value}:current.quality;
        state.data={...current,ranking,alerts:[...alertsByKey.values()],quality};
        state.insightsUnavailable=results.some(result=>result.status==="rejected");
        render();
      }
      async function load() {
        const active=selectedDays();
        if(!active.length){render();return;}
        const first=active[0].di,last=active.at(-1).di,requestId=++state.loadId;
        state.data=null;state.insightsUnavailable=false;render();
        try {
          const daily=await api(`v_daily?typ=eq.msgs&di=gte.${first}&di=lte.${last}&select=${DAILY_FIELDS}`);
          if(requestId!==state.loadId)return;
          state.data=deriveDashboard(daily);render();
          void enrichDashboard(first,last,requestId);
        } catch {
          if(requestId!==state.loadId)return;
          APP.innerHTML='<section class="message"><h2>Não foi possível atualizar o painel</h2><p>Verifique a conexão com a base de dados e tente novamente.</p><button class="retry" id="retry">Tentar novamente</button></section>';
          document.getElementById("retry").addEventListener("click",start);
        }
      }
      async function start() {
        try {
          state.days=await api("days?select=di,date,label,badge&order=di.asc");
          state.expandedMonth=null;
          state.expandedDay=null;
          syncHash();
          void loadHistory();
          await load();
        } catch {
          APP.innerHTML='<section class="message"><h2>Não foi possível iniciar o painel</h2><p>Verifique a conexão com a base de dados e tente novamente.</p><button class="retry" id="retry">Tentar novamente</button></section>';
          document.getElementById("retry").addEventListener("click",start);
        }
      }
      window.addEventListener("hashchange",()=>{ const next=readHash(); if(next.range===state.range&&next.start===state.start&&next.end===state.end)return; state.range=next.range;state.start=next.start;state.end=next.end;if(state.days.length)load(); });
      start();
    </script>
