<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="DASHFULL — performance diária com decisões claras." />
    <meta name="theme-color" content="#f4f7fb" />
    <title>DASHFULL · Performance diária</title>
    <style>
      :root {
        --ink:#162238;
        --muted:#64748b;
        --line:#e3eaf3;
        --blue:#245dd8;
        --blue-soft:#eaf0ff;
        --green:#078a63;
        --green-soft:#e4f7ef;
        --red:#d04457;
        --red-soft:#fff0f2;
        --amber:#9a6200;
        --amber-soft:#fff7df;
        --surface:#fff;
        --page:#f4f7fb;
      }

      * { box-sizing:border-box; }
      body {
        margin:0;
        background:var(--page);
        color:var(--ink);
        font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      }
      button,input { font:inherit; }
      button { cursor:pointer; }
      button:focus-visible,input:focus-visible { outline:3px solid #98b4fb; outline-offset:2px; }

      .shell { max-width:1440px; margin:auto; padding:28px clamp(16px,4vw,56px) 46px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin:0 0 26px; }
      .brand { display:flex; align-items:center; gap:13px; }
      .mark {
        display:grid;
        place-items:center;
        width:44px;
        height:44px;
        border-radius:14px;
        background:linear-gradient(145deg,#1947ad,#2e71f0);
        box-shadow:0 8px 18px #2e71f040;
        color:#fff;
        font-weight:800;
        letter-spacing:-.08em;
      }
      .eyebrow { margin:0 0 2px; color:var(--blue); font-size:10px; font-weight:800; letter-spacing:.13em; }
      h1 { margin:0; font-size:22px; line-height:1; letter-spacing:-.045em; }
      .subtitle { margin:5px 0 0; color:var(--muted); font-size:12px; }
      .date-control { position:relative; z-index:30; }
      .date-trigger {
        display:flex;
        align-items:center;
        gap:9px;
        border:1px solid var(--line);
        border-radius:11px;
        padding:8px 11px;
        background:#fff;
        color:#40516a;
        box-shadow:0 4px 14px #2034540a;
        font-size:11px;
        font-weight:800;
        white-space:nowrap;
      }
      .date-trigger:hover { border-color:#bdcdf0; color:var(--blue); }
      .calendar-icon { position:relative; width:17px; height:16px; border:2px solid currentColor; border-radius:4px; }
      .calendar-icon::before { content:""; position:absolute; top:3px; right:-2px; left:-2px; border-top:2px solid currentColor; }
      .calendar-icon::after { content:""; position:absolute; top:-4px; left:3px; width:7px; height:4px; border-right:2px solid currentColor; border-left:2px solid currentColor; }
      .date-picker-backdrop { position:fixed; z-index:31; inset:0; background:#0f1b2b29; }
      .date-picker {
        position:absolute;
        z-index:32;
        top:calc(100% + 10px);
        right:0;
        display:grid;
        width:min(820px,calc(100vw - 32px));
        grid-template-columns:190px minmax(0,1fr);
        overflow:hidden;
        border:1px solid var(--line);
        border-radius:16px;
        background:#fff;
        box-shadow:0 24px 70px #17263d38;
      }
      .date-presets { display:flex; flex-direction:column; gap:2px; border-right:1px solid var(--line); padding:15px 10px; background:#f8faff; }
      .date-presets h2 { margin:0 8px 9px; color:#40516a; font-size:12px; }
      .date-presets button { border:0; border-radius:8px; padding:7px 9px; background:transparent; color:#526277; font-size:11px; font-weight:700; text-align:left; }
      .date-presets button:hover,.date-presets button.active { background:var(--blue-soft); color:var(--blue); }
      .date-custom { min-width:0; padding:15px; }
      .date-fields { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin-bottom:13px; }
      .date-fields span { min-width:0; border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:#fbfcfe; }
      .date-fields small,.date-fields strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .date-fields small { color:var(--muted); font-size:8px; font-weight:700; text-transform:uppercase; }
      .date-fields strong { margin-top:2px; color:#33445d; font-size:11px; }
      .date-fields i { color:#9aa7b8; font-style:normal; }
      .calendar-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; color:var(--muted); font-size:10px; font-weight:700; }
      .calendar-nav button { display:grid; width:28px; height:28px; place-items:center; border:1px solid var(--line); border-radius:50%; background:#fff; color:#526277; }
      .calendar-nav button:disabled { cursor:not-allowed; opacity:.35; }
      .calendars { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
      .calendar-panel h3 { margin:0 0 7px; color:#33445d; font-size:11px; text-align:center; }
      .calendar-weekdays,.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
      .calendar-weekdays { margin-bottom:3px; color:#8a97a8; font-size:8px; font-weight:800; text-align:center; }
      .calendar-day,.calendar-empty { position:relative; display:grid; min-width:0; aspect-ratio:1; place-items:center; border:0; border-radius:50%; background:transparent; color:#43536a; font-size:10px; }
      .calendar-day:hover:not(:disabled) { background:var(--blue-soft); color:var(--blue); }
      .calendar-day.in-range { border-radius:7px; background:#eef3ff; }
      .calendar-day.selected { background:var(--blue); color:#fff; font-weight:800; }
      .calendar-day:disabled { cursor:not-allowed; color:#c9d1dc; }
      .calendar-day.has-data::after { content:""; position:absolute; bottom:3px; width:3px; height:3px; border-radius:50%; background:var(--green); }
      .calendar-day.selected::after { background:#fff; }
      .calendar-day.no-data:not(:disabled) { color:#9da9b8; }
      .date-picker-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:13px; border-top:1px solid #edf1f5; padding-top:12px; }
      .date-picker-footer p { display:flex; align-items:center; gap:5px; margin:0; color:var(--muted); font-size:8px; }
      .date-picker-footer p span { width:6px; height:6px; border-radius:50%; }
      .legend-data { background:var(--green); }
      .legend-empty { margin-left:5px; border:1px solid #aab5c3; background:#fff; }
      .date-picker-footer > div { display:flex; gap:7px; }
      .date-cancel,.date-apply { border:1px solid var(--line); border-radius:8px; padding:7px 11px; background:#fff; color:#526277; font-size:10px; font-weight:800; }
      .date-apply { border-color:var(--blue); background:var(--blue); color:#fff; }
      .date-apply:disabled { cursor:not-allowed; opacity:.42; }

      .panel,.metric,.history,.message {
        border:1px solid var(--line);
        border-radius:16px;
        background:var(--surface);
        box-shadow:0 5px 17px #20345408;
      }
      .modal-scopes { display:flex; flex-wrap:wrap; gap:7px; }
      .modal-scopes button {
        border:1px solid var(--line);
        border-radius:8px;
        padding:6px 9px;
        background:#fff;
        color:#526277;
        font-size:12px;
        font-weight:700;
      }
      .modal-scopes button.active { border-color:var(--blue); background:var(--blue); color:#fff; }
      .modal-scopes button[disabled] { cursor:wait; opacity:.55; }

      .workspace { display:grid; grid-template-columns:minmax(286px,320px) minmax(0,1fr); align-items:start; gap:13px; margin-top:14px; }
      .main { min-width:0; }
      .context { display:flex; align-items:center; gap:8px; margin:0 2px 16px; color:var(--muted); font-size:12px; }
      .context strong { color:#40516a; }
      .separator { color:#bdc8d5; }

      .history { position:sticky; top:18px; display:flex; max-height:calc(100dvh - 36px); flex-direction:column; overflow:hidden; }
      .history-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:16px 15px 13px; border-bottom:1px solid var(--line); }
      .history-head h2 { margin:0; font-size:15px; letter-spacing:-.025em; }
      .history-head p:not(.eyebrow) { margin:4px 0 0; color:var(--muted); font-size:10px; }
      .history-head > span { border-radius:999px; padding:4px 7px; background:var(--blue-soft); color:var(--blue); font-size:10px; font-weight:800; white-space:nowrap; }
      .history-days { overflow-y:auto; }
      .history-month { border-bottom:1px solid var(--line); }
      .history-month:last-child { border-bottom:0; }
      .month-btn {
        display:grid;
        width:100%;
        border:0;
        background:transparent;
        color:var(--ink);
        text-align:left;
      }
      .month-btn { grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; padding:12px 13px; }
      .month-btn:hover { background:#f8faff; }
      .month-btn span { display:grid; gap:2px; }
      .month-btn b { font-size:12px; }
      .month-btn small { color:var(--muted); font-size:10px; }
      .month-btn i { color:var(--blue); font-size:15px; font-style:normal; }

      .notice { display:flex; align-items:flex-start; gap:9px; margin:0 0 10px; border:1px solid #f1da93; border-radius:12px; padding:11px 13px; background:var(--amber-soft); color:#775118; font-size:12px; }
      .notice-info { border-color:#d8e3f6; background:#f4f8ff; color:#40577d; }
      .insight-note { margin:0 2px 12px; color:var(--muted); font-size:10px; }
      .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:13px; margin-bottom:13px; }
      .metric { min-height:131px; padding:17px; }
      .metric-label { color:var(--muted); font-size:12px; font-weight:750; }
      .metric-value { margin:10px 0 9px; font-size:clamp(21px,2.2vw,29px); font-weight:800; letter-spacing:-.055em; }
      .metric-foot { color:#7a899c; font-size:11px; }
      .infinite-roi { display:inline-block; font-size:.86em; font-weight:650; line-height:1; letter-spacing:0; vertical-align:baseline; }
      .positive { color:var(--green)!important; }
      .negative { color:var(--red)!important; }
      .content { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr); gap:13px; margin-bottom:13px; }
      .panel { min-width:0; padding:18px; }
      .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:11px; }
      h2 { margin:0; font-size:15px; letter-spacing:-.025em; }
      .panel-head p { margin:3px 0 0; color:var(--muted); font-size:11px; }
      .legend { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; color:var(--muted); font-size:10px; }
      .legend span { display:flex; align-items:center; gap:4px; }
      .legend i { width:7px; height:7px; border-radius:50%; }
      .chart { display:grid; min-height:250px; place-items:center; overflow:hidden; }
      .chart svg { display:block; width:100%; height:auto; max-height:270px; }
      .axis { fill:#8390a3; font-size:10px; }
      .alerts { display:grid; }
      .alert {
        display:grid;
        width:100%;
        grid-template-columns:max-content minmax(0,1fr) 58px;
        align-items:start;
        gap:9px;
        border:0;
        border-top:1px solid #edf1f5;
        padding:11px 0;
        background:transparent;
        color:inherit;
        text-align:left;
      }
      .alert > span:nth-child(2) { min-width:0; }
      .alert:first-child { border-top:0; padding-top:2px; }
      .alert[data-campaign] { cursor:pointer; }
      .alert[data-campaign]:hover .alert-title { color:var(--blue); }
      .tag { border-radius:999px; padding:3px 6px; background:#eff3f8; color:#65758a; font-size:9px; font-weight:800; text-transform:uppercase; }
      .tag.pausar,.tag.alerta { background:var(--red-soft); color:var(--red); }
      .tag.reduzir { background:var(--amber-soft); color:var(--amber); }
      .tag.investigar { background:#f2ebff; color:#7b4cb1; }
      .tag.escalar,.tag.oportunidade { background:var(--green-soft); color:var(--green); }
      .alert-title { display:block; overflow-wrap:anywhere; color:#33445d; font-size:12px; font-weight:800; line-height:1.3; }
      .alert-detail { display:block; margin-top:3px; overflow-wrap:anywhere; color:var(--muted); font-size:11px; line-height:1.45; }
      .impact { width:58px; font-size:12px; font-weight:800; line-height:1.2; text-align:right; white-space:nowrap; }
      .impact small { display:block; margin-bottom:2px; color:var(--muted); font-size:8px; font-weight:700; text-transform:uppercase; }
      .alert:has(.tag.alerta) { grid-template-columns:minmax(0,1fr) 58px; }
      .alert:has(.tag.alerta) .tag.alerta { display:none; }
      .table-panel { padding-bottom:5px; }
      .table-tools input { width:min(270px,42vw); border:1px solid var(--line); border-radius:8px; padding:7px 9px; outline-color:var(--blue); }
      .scroller { overflow:auto; margin:0 -18px; padding:0 18px; }
      table { width:100%; min-width:790px; border-collapse:collapse; text-align:left; }
      th { border-bottom:1px solid var(--line); padding:10px 8px; color:#8390a2; font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
      td { border-bottom:1px solid #edf1f5; padding:11px 8px; color:#45566d; font-size:12px; white-space:nowrap; }
      .sort-head { padding:0; }
      .sort-button {
        display:flex;
        width:100%;
        align-items:center;
        gap:5px;
        border:0;
        padding:10px 8px;
        background:transparent;
        color:inherit;
        font:inherit;
        font-weight:inherit;
        letter-spacing:inherit;
        text-align:left;
        text-transform:inherit;
        white-space:nowrap;
      }
      .sort-button:hover { color:var(--blue); }
      .sort-arrow { min-width:9px; color:var(--blue); font-size:10px; }
      tbody tr:last-child td { border-bottom:0; }
      tr[data-campaign] { cursor:pointer; }
      tr[data-campaign]:hover { background:#f7faff; }
      .campaign { color:#1d4cb8; font-weight:800; }
      .residual-label { display:block; margin-top:2px; color:#a66a13; font-size:9px; font-weight:500; line-height:1.15; white-space:nowrap; }
      .trend { color:#6b7b90; }
      .reco { display:inline-block; border-radius:999px; padding:3px 7px; background:#eff3f8; color:#64748b; font-size:10px; font-weight:800; }
      .reco.escalar { background:var(--green-soft); color:var(--green); }
      .reco.pausar { background:var(--red-soft); color:var(--red); }
      .empty { padding:28px 6px; color:var(--muted); font-size:12px; text-align:center; }
      .source { margin:15px 2px 0; color:#8794a6; font-size:10px; }
      .message { max-width:500px; margin:12vh auto; padding:26px; text-align:center; }
      .message h2 { font-size:18px; }
      .message p { color:var(--muted); }
      .retry { border:0; border-radius:8px; padding:8px 12px; background:var(--blue); color:#fff; font-weight:800; }

      .modal-root { position:fixed; z-index:20; inset:0; }
      .modal-backdrop { position:absolute; inset:0; background:#101b2a55; }
      .modal {
        position:relative;
        z-index:1;
        width:min(940px,calc(100vw - 28px));
        max-height:calc(100dvh - 28px);
        margin:14px auto;
        overflow:auto;
        border:1px solid var(--line);
        border-radius:18px;
        padding:23px;
        background:#fff;
        box-shadow:0 22px 60px #17263d44;
      }
      .modal-close { position:absolute; top:12px; right:12px; width:31px; height:31px; border:0; border-radius:50%; background:#f0f3f8; color:#46566d; font-size:21px; line-height:1; }
      .modal-back { position:absolute; top:12px; left:12px; display:grid; width:31px; height:31px; place-items:center; border:0; border-radius:50%; background:#f0f3f8; color:#46566d; font-size:19px; line-height:1; }
      .modal-back[hidden] { display:none; }
      .modal-heading { padding:0 40px; }
      .detail-name { margin:4px 40px 3px 0; font-size:21px; letter-spacing:-.04em; }
      .detail-sub { margin:0; color:var(--muted); font-size:12px; }
      .modal-period { margin:15px 0 9px; color:#40516a; font-size:12px; font-weight:750; }
      .modal-note { margin:10px 0 0; color:var(--muted); font-size:11px; }
      .detail-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin:18px 0 12px; }
      .detail-metric { min-width:0; border-radius:10px; padding:10px; background:#f6f8fb; }
      .detail-metric span { display:block; overflow:hidden; color:var(--muted); font-size:10px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
      .detail-metric strong { display:block; overflow:hidden; margin-top:4px; font-size:14px; letter-spacing:-.03em; text-overflow:ellipsis; white-space:nowrap; }
      .detail-status { display:flex; align-items:center; gap:6px; margin:0 0 15px; color:var(--muted); font-size:11px; text-transform:capitalize; }
      .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#9aa7b8; }
      .dot.lucro { background:var(--green); }
      .dot.negativo { background:var(--red); }
      .dot.quase { background:#b7791f; }
      .dot.aguardando { background:var(--blue); }
      .comparisons { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:7px; margin:0 0 18px; }
      .comparison { min-width:0; border:1px solid #edf0f5; border-radius:8px; padding:8px; }
      .comparison span,.comparison small { display:block; color:var(--muted); font-size:9px; font-weight:700; }
      .comparison strong { display:block; overflow:hidden; margin:3px 0 1px; color:var(--ink); font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
      .comparison small { font-size:8px; font-weight:600; }
      .modal-chart { min-height:225px; margin:0 0 18px; border:1px solid #edf0f5; border-radius:12px; padding:13px; }
      .modal-chart h3 { margin:0; font-size:14px; letter-spacing:-.02em; }
      .modal-chart p { margin:3px 0 8px; color:var(--muted); font-size:10px; }
      .modal-chart .chart { min-height:200px; }
      .drawer-status { display:flex; align-items:center; gap:5px; text-transform:capitalize; }
      .nav-modal { width:min(1500px,calc(100vw - 28px)); }
      .nav-modal .modal-period { margin-bottom:3px; }
      .nav-modal .scroller { max-height:min(60dvh,610px); margin-top:16px; border:1px solid #edf0f5; border-radius:11px; padding:0; }
      .nav-modal .scroller table { min-width:1180px; }
      .nav-modal .scroller .month-table,.nav-modal .scroller .day-table { min-width:1450px; }
      .nav-modal .scroller th { position:sticky; z-index:2; top:0; background:#fff; }
      .drill-row { cursor:pointer; }
      .drill-row:hover,.drill-row:focus { background:#f7faff; outline:0; }
      .drill-row .campaign,.drill-link { color:#1d4cb8; font-weight:800; text-decoration:underline; text-decoration-color:#c5d5fc; text-underline-offset:3px; }
      .month-table th:first-child,.month-table td:first-child { position:sticky; z-index:3; left:0; background:#fff; }
      .month-table th:nth-child(2),.month-table td:nth-child(2) { position:sticky; z-index:3; left:92px; background:#fff; }
      .month-table .drill-row:hover td:first-child,.month-table .drill-row:hover td:nth-child(2),
      .month-table .drill-row:focus td:first-child,.month-table .drill-row:focus td:nth-child(2) { background:#f7faff; }
      .modal-loading { display:grid; min-height:280px; place-items:center; color:var(--muted); font-size:12px; text-align:center; }
      .modal-error { margin:18px 0 0; border:1px solid #f2ccd2; border-radius:10px; padding:13px; background:var(--red-soft); color:#9b3444; font-size:12px; }
      .coverage-warning { margin:10px 0 0; border:1px solid #f1da93; border-radius:9px; padding:9px 11px; background:var(--amber-soft); color:#775118; font-size:10px; }
      .coverage-warning + .tax-note { margin-top:9px; }
      .residual-note { margin:10px 0 0; border-radius:9px; padding:8px 10px; background:#fff8e8; color:#8b611f; font-size:10px; }
      .residual-note + .tax-note { margin-top:9px; }
      .tax-note { margin:0; color:var(--muted); font-size:10px; }

      @media (max-width:1220px) {
        .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
        .content { grid-template-columns:1fr; }
      }
      @media (max-width:980px) {
        .workspace { grid-template-columns:1fr; }
        .history { position:static; max-height:520px; }
      }
      @media (max-width:760px) {
        .date-picker { position:fixed; top:10px; right:10px; left:10px; width:auto; max-height:calc(100dvh - 20px); grid-template-columns:1fr; overflow:auto; }
        .date-presets { flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:11px; }
        .date-presets h2 { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
        .date-presets button { flex:0 0 auto; white-space:nowrap; }
        .calendars { grid-template-columns:1fr; }
        .calendar-primary { display:none; }
        .calendar-day,.calendar-empty { max-height:40px; }
      }
      @media (max-width:650px) {
        .shell { padding-top:19px; }
        .topbar { align-items:flex-start; }
        .date-trigger { width:42px; height:42px; justify-content:center; padding:0; }
        .date-trigger-label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
        .metrics { gap:9px; }
        .metric { min-height:116px; padding:13px; }
        .panel { padding:14px; }
        .scroller { margin:0 -14px; padding:0 14px; }
        .panel-head { flex-wrap:wrap; }
        .legend { justify-content:flex-start; }
        .table-tools { width:100%; }
        .table-tools input { width:100%; }
        .history { max-height:470px; }

        .detail-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
