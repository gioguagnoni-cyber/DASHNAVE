    </style>
  </head>
  <body>
    <main class="shell" id="app" aria-live="polite">
      <section class="message"><h2>Preparando a DASHFULL</h2><p>Conectando aos dados de performance…</p></section>
    </main>
    <script>
      const SUPABASE_URL = "https://akffepitbqqqgldxvtlf.supabase.co";
      const SUPABASE_KEY = "sb_publishable_yEPQth9v7-mNr0tPavuQyw_yv9IkJbk";
      const DAILY_FIELDS = "di,date,campaign_id,label,suffix,niche,spend,tax,cost,cap_rev,broad_rev,rev,rev_adj,profit,roi,novos,rpm,status,qualidade,ciclo_vida,saude,residual";
      const APP = document.getElementById("app");
      const PAGE_SIZE = 500;
      const RANGE_VALUES = new Set([3,7,30]);
      const DATE_PRESETS = [
        { id:"today", label:"Hoje" },
        { id:"yesterday", label:"Ontem" },
        { id:"last7", label:"Últimos 7 dias" },
        { id:"last30", label:"Últimos 30 dias" },
        { id:"last90", label:"Últimos 90 dias" },
        { id:"thisMonth", label:"Este mês" },
        { id:"lastMonth", label:"Mês passado" },
        { id:"thisQuarter", label:"Este trimestre" },
        { id:"thisYear", label:"Este ano" },
        { id:"custom", label:"Personalizado" }
      ];
      const MODAL_SCOPES = [
        { id:"panel", label:"Período do painel" },
        { id:"1", label:"1 dia" },
        { id:"3", label:"3 dias" },
        { id:"7", label:"7 dias" },
        { id:"14", label:"14 dias" },
        { id:"complete", label:"Histórico completo" }
      ];

      const readHash = () => {
        const params = new URLSearchParams(location.hash.slice(1));
        const start = params.get("ini") || "";
        const end = params.get("fim") || "";
        const range = Number(params.get("p"));
        return start && end
          ? { range:7, start, end, preset:"custom" }
          : { range:RANGE_VALUES.has(range) ? range : 7, start:"", end:"", preset:`last${RANGE_VALUES.has(range) ? range : 7}` };
      };

      const initialHash = readHash();
      const state = {
        days: [],
        range: initialHash.range,
        start: initialHash.start,
        end: initialHash.end,
        preset: initialHash.preset,
        datePickerOpen: false,
        draftStart: initialHash.start,
        draftEnd: initialHash.end,
        draftPreset: initialHash.preset,
        calendarMonth: (initialHash.start || new Date().toISOString().slice(0,10)).slice(0,7),
        data: null,
        query: "",
        monthCache: new Map(),
        campaignCache: new Map(),
        modalStack: [],
        modalBaseScroll: 0,
        modalOpener: null,
        rankingSort: { key:"profit", direction:"desc" },
        loadId: 0,
        insightsUnavailable: false
      };

      const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
      const money = value => new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL", maximumFractionDigits:0 }).format(number(value));
      const moneyPrecise = value => new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL", minimumFractionDigits:2, maximumFractionDigits:2 }).format(number(value));
      const pct = value => `${number(value) > 0 ? "+" : ""}${number(value).toFixed(1)}%`;
      const date = value => value ? `${value.slice(8,10)}/${value.slice(5,7)}/${value.slice(2,4)}` : "—";
      const shortDate = value => date(value).slice(0,5);
      const monthLabel = value => {
        const label = new Intl.DateTimeFormat("pt-BR", { month:"long", year:"numeric" }).format(new Date(`${value}T12:00:00`));
        return label.charAt(0).toUpperCase() + label.slice(1);
      };
      const todayIso = () => {
        const current = new Date();
        return `${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2,"0")}-${String(current.getDate()).padStart(2,"0")}`;
      };
      const isoShift = (value, amount) => {
        const shifted = new Date(`${value}T12:00:00Z`);
        shifted.setUTCDate(shifted.getUTCDate() + amount);
        return shifted.toISOString().slice(0, 10);
      };
      const monthShift = (key, amount) => {
        const shifted = new Date(`${key}-01T12:00:00Z`);
        shifted.setUTCMonth(shifted.getUTCMonth() + amount);
        return shifted.toISOString().slice(0,7);
      };
      const periodForPreset = (preset, anchor = todayIso()) => {
        const month = anchor.slice(0,7);
        if (preset === "today") return { start:anchor, end:anchor };
        if (preset === "yesterday") {
          const yesterday = isoShift(anchor, -1);
          return { start:yesterday, end:yesterday };
        }
        if (preset === "last7") return { start:isoShift(anchor, -6), end:anchor };
        if (preset === "last30") return { start:isoShift(anchor, -29), end:anchor };
        if (preset === "last90") return { start:isoShift(anchor, -89), end:anchor };
        if (preset === "thisMonth") return { start:`${month}-01`, end:anchor };
        if (preset === "lastMonth") {
          const previous = monthShift(month, -1);
          return { start:`${previous}-01`, end:isoShift(`${month}-01`, -1) };
        }
        if (preset === "thisQuarter") {
          const parsed = new Date(`${anchor}T12:00:00Z`);
          const quarterMonth = Math.floor(parsed.getUTCMonth() / 3) * 3 + 1;
          return { start:`${parsed.getUTCFullYear()}-${String(quarterMonth).padStart(2,"0")}-01`, end:anchor };
        }
        if (preset === "thisYear") return { start:`${anchor.slice(0,4)}-01-01`, end:anchor };
        return { start:state.draftStart || state.start, end:state.draftEnd || state.end };
      };
      const monthBounds = key => {
        const start = `${key}-01`;
        const end = new Date(`${start}T12:00:00Z`);
        end.setUTCMonth(end.getUTCMonth() + 1);
        return { start, end:end.toISOString().slice(0,10), contextStart:isoShift(start, -13) };
      };
      const monthDaysForKey = key => state.days.filter(day => day.date.startsWith(`${key}-`));
      const monthCoverage = days => {
        const dates = [...new Set(days.map(day => day.date).filter(Boolean))].sort();
        if (!dates.length) return { first:null, last:null, periodDays:0, daysWithData:0, missing:[] };
        const recorded = new Set(dates);
        const missing = [];
        let periodDays = 0;
        for (let current = dates[0]; current <= dates.at(-1); current = isoShift(current, 1)) {
          periodDays += 1;
          if (!recorded.has(current)) missing.push(current);
        }
        return {
          first:dates[0],
          last:dates.at(-1),
          periodDays,
          daysWithData:dates.length,
          missing
        };
      };
      const tone = value => number(value) > 0 ? "positive" : number(value) < 0 ? "negative" : "";
      const statusClass = value => value === "3 dias negativos" ? "alerta" : ["lucro","negativo","quase","aguardando","pausar","reduzir","escalar","investigar"].includes(value) ? value : "sem-status";
      const escape = value => String(value ?? "").replace(/[&<>'\"]/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", "\"":"&quot;" })[char]);

      const api = async (path, options = {}, timeout = 7000) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
            ...options,
            signal:controller.signal,
            headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json", ...options.headers }
          });
          if (!response.ok) throw new Error("Não foi possível carregar os dados.");
          return response.json();
        } finally {
          clearTimeout(timer);
        }
      };
      const apiAll = async path => {
        const rows = [];
        const separator = path.includes("?") ? "&" : "?";
        for (let offset = 0; ; offset += PAGE_SIZE) {
          const page = await api(`${path}${separator}limit=${PAGE_SIZE}&offset=${offset}`, {}, 10000);
          rows.push(...page);
          if (page.length < PAGE_SIZE) return rows;
        }
      };
      const rpc = (name, body) => api(`rpc/${name}`, { method:"POST", body:JSON.stringify(body) }, 4500);

      function syncHash() {
        const params = new URLSearchParams();
        params.set("ini", state.start);
        params.set("fim", state.end);
        history.replaceState(null, "", `${location.pathname}${location.search}#${params}`);
      }

      function ensureInitialPeriod() {
        const today = todayIso();
        if (state.start && state.end) {
          if (state.start > state.end) [state.start, state.end] = [state.end, state.start];
          if (state.end > today) state.end = today;
          if (state.start > today) state.start = state.end;
          return;
        }
        const latestData = state.days.at(-1)?.date || today;
        const anchor = latestData < today ? latestData : today;
        state.end = anchor;
        state.start = isoShift(anchor, -state.range + 1);
        state.preset = state.range === 7 || state.range === 30 ? `last${state.range}` : "custom";
      }

      const selectedDays = () => state.start && state.end
        ? state.days.filter(day => day.date >= state.start && day.date <= state.end)
        : state.days.slice(-state.range);
      const isResidual = row => row?.residual === true || row?.residual === "true";
      const residualLabel = '<small class="residual-label">receita residual</small>';
      const campaignName = row => `${escape(row.label)}${isResidual(row) ? residualLabel : ""}`;

      const totals = rows => rows.reduce((all, row) => ({
        spend:all.spend + number(row.spend),
        cost:all.cost + number(row.cost),
        gross:all.gross + number(row.rev),
        revenue:all.revenue + number(row.rev_adj),
        profit:all.profit + number(row.profit),
        capRev:all.capRev + number(row.cap_rev),
        broadRev:all.broadRev + number(row.broad_rev)
      }), { spend:0, cost:0, gross:0, revenue:0, profit:0, capRev:0, broadRev:0 });

      const dailyRoi = row => {
        const cost = number(row.cost);
        return cost ? number(row.profit) / cost * 100 : 0;
      };
      const roiForRow = row => number(row.cost) ? dailyRoi(row) : number(row.rev_adj) > 0 ? null : undefined;
      const infinityRoi = '<span class="infinite-roi" title="Receita com custo zerado" aria-label="Infinito: receita com custo zerado">∞</span>';
      const roiText = value => value === null ? infinityRoi : value === undefined ? "—" : pct(value);
      const totalRoi = rows => {
        if (!rows.length) return undefined;
        const all = totals(rows);
        return all.cost ? all.profit / all.cost * 100 : all.revenue > 0 ? null : undefined;
      };
      const compareValues = (first, second, direction) => {
        const aMissing = first === null || first === undefined || Number.isNaN(first);
        const bMissing = second === null || second === undefined || Number.isNaN(second);
        if (aMissing || bMissing) return aMissing === bMissing ? 0 : aMissing ? 1 : -1;
        const result = typeof first === "string" || typeof second === "string"
          ? String(first).localeCompare(String(second), "pt-BR", { numeric:true, sensitivity:"base" })
          : number(first) - number(second);
        return direction === "desc" ? -result : result;
      };
      const sortRows = (rows, sort, getters = {}) => rows.slice().sort((a, b) => {
        const getter = getters[sort.key] || (row => row[sort.key]);
        return compareValues(getter(a), getter(b), sort.direction);
      });
      const sortableHead = (label, key, sort, scope = "modal") => {
        const active = sort.key === key;
        const aria = active ? (sort.direction === "asc" ? "ascending" : "descending") : "none";
        const arrow = active ? (sort.direction === "asc" ? "↑" : "↓") : "";
        return `<th class="sort-head" aria-sort="${aria}"><button type="button" class="sort-button" data-${scope}-sort="${key}">${label}<span class="sort-arrow" aria-hidden="true">${arrow}</span></button></th>`;
      };

      function deriveDashboard(daily) {
        const groups = new Map();
        const operationalDaily = daily.filter(row => !isResidual(row));
        operationalDaily.forEach(row => {
          const group = groups.get(row.campaign_id) || { campaign_id:row.campaign_id, label:row.label, suffix:row.suffix, niche:row.niche, rows:[] };
          group.rows.push(row);
          groups.set(row.campaign_id, group);
        });

        const alerts = [];
        const ranking = [...groups.values()].map(group => {
          const rows = group.rows.slice().sort((a, b) => number(a.di) - number(b.di));
          const all = totals(rows);
          const roi = all.cost ? all.profit / all.cost * 100 : 0;
          const midpoint = Math.ceil(rows.length / 2);
          const first = totals(rows.slice(0, midpoint));
          const last = totals(rows.slice(midpoint));
          const firstRoi = first.cost ? first.profit / first.cost * 100 : 0;
          const lastRoi = last.cost ? last.profit / last.cost * 100 : 0;
          const tendencia = rows.length < 2 ? "indefinida" : lastRoi - firstRoi > 2 ? "subindo" : firstRoi - lastRoi > 2 ? "caindo" : "estável";
          const recomendacao = all.cost >= 150 && roi < 0 ? "pausar" : all.cost >= 150 && roi >= 20 ? "escalar" : "acompanhar";
          let streak = [];

          rows.forEach(row => {
            if (number(row.cost) > 0 && dailyRoi(row) < 0) {
              streak = streak.length && number(row.di) === number(streak.at(-1).di) + 1 ? [...streak, row] : [row];
            } else {
              streak = [];
            }
          });

          if (streak.length >= 3) {
            const lastThree = streak.slice(-3);
            const impact = Math.abs(lastThree.reduce((sum, row) => sum + number(row.profit), 0));
            alerts.push({
              campaign_id:group.campaign_id,
              label:group.label,
              tipo:"3 dias negativos",
              prioridade:0,
              impacto:impact,
              detalhe:"ROI negativo, três dias consecutivos."
            });
          }

          return {
            campaign_id:group.campaign_id,
            label:group.label,
            suffix:group.suffix,
            niche:group.niche,
            spend:all.spend,
            cost:all.cost,
            rev_adj:all.revenue,
            profit:all.profit,
            roi,
            tendencia,
            recomendacao
          };
        }).sort((a, b) => number(b.profit) - number(a.profit));

        const portfolio = totals(daily);
        return {
          summary:{
            portfolio:{
              spend:portfolio.spend,
              cost:portfolio.cost,
              rev_adj:portfolio.revenue,
              profit:portfolio.profit,
              roi:portfolio.cost ? portfolio.profit / portfolio.cost * 100 : 0,
              campanhas:groups.size
            }
          },
          ranking,
          alerts,
          clientAlerts:alerts,
          quality:{
            dias_parciais:state.days.filter(day => day.badge === "parcial").map(day => date(day.date)),
            inconsistentes:daily.filter(row => row.qualidade === "inconsistente").length,
            suspeitos:daily.filter(row => row.qualidade === "suspeito").length
          },
          daily
        };
      }

      function aggregate(rows) {
        const grouped = new Map();
        rows.forEach(row => {
          const current = grouped.get(row.di) || { di:row.di, date:row.date, spend:0, rev:0, profit:0 };
          current.spend += number(row.spend);
          current.rev += number(row.rev_adj);
          current.profit += number(row.profit);
          grouped.set(row.di, current);
        });
        return [...grouped.values()].sort((a, b) => number(a.di) - number(b.di));
      }

      function chart(rows, ariaLabel = "Evolução diária de gasto, receita e lucro") {
        const points = aggregate(rows);
        if (!points.length) return '<div class="empty">Não há resultado diário neste período.</div>';

        const width = 720;
        const height = 245;
        const padding = { top:14, right:14, bottom:29, left:14 };
        const innerWidth = width - padding.left - padding.right;
        const innerHeight = height - padding.top - padding.bottom;
        const high = Math.max(...points.flatMap(row => [row.spend, row.rev]), 1);
        const lowProfit = Math.min(0, ...points.map(row => row.profit));
        const highProfit = Math.max(0, ...points.map(row => row.profit));
        const profitSpan = highProfit - lowProfit || 1;
        const x = index => padding.left + (points.length === 1 ? innerWidth / 2 : index / (points.length - 1) * innerWidth);
        const y = value => padding.top + innerHeight - value / high * innerHeight;
        const profitY = value => padding.top + innerHeight - (value - lowProfit) / profitSpan * innerHeight;
        const barWidth = Math.max(5, Math.min(15, innerWidth / points.length * .31));
        const every = Math.max(1, Math.ceil(points.length / 6));
        const bars = points.map((row, index) => `<g>
          <rect x="${x(index) - barWidth - 1}" y="${y(row.spend)}" width="${barWidth}" height="${Math.max(0, padding.top + innerHeight - y(row.spend))}" rx="2" fill="#bfd0f7"/>
          <rect x="${x(index) + 1}" y="${y(row.rev)}" width="${barWidth}" height="${Math.max(0, padding.top + innerHeight - y(row.rev))}" rx="2" fill="#84ceb4"/>
          ${(index % every === 0 || index === points.length - 1) ? `<text class="axis" x="${x(index)}" y="${height - 8}" text-anchor="middle">${shortDate(row.date)}</text>` : ""}
        </g>`).join("");
        const line = points.map((row, index) => `${x(index)},${profitY(row.profit)}`).join(" ");
        const dots = points.map((row, index) => `<circle cx="${x(index)}" cy="${profitY(row.profit)}" r="2.7" fill="#245dd8"/>`).join("");

        return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escape(ariaLabel)}">
          <line x1="${padding.left}" x2="${width - padding.right}" y1="${profitY(0)}" y2="${profitY(0)}" stroke="#dfe5ed" stroke-dasharray="3 4"/>
          ${bars}
          <polyline fill="none" points="${line}" stroke="#245dd8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
          ${dots}
        </svg>`;
      }

      function historyMarkup() {
        const months = new Map();
        state.days.forEach(day => {
          const key = day.date.slice(0, 7);
          const group = months.get(key) || { key, label:monthLabel(`${key}-01`), days:[] };
          group.days.push(day);
          months.set(key, group);
        });
        const groups = [...months.values()].reverse();

        return `<aside class="history" aria-label="Histórico mensal de campanhas">
          <div class="history-head">
            <div><p class="eyebrow">HISTÓRICO COMPLETO</p><h2>Campanhas por mês</h2><p>Escolha um mês para visualizar os dias.</p></div>
            <span>${groups.length} ${groups.length === 1 ? "mês" : "meses"}</span>
          </div>
          <div class="history-days">
            ${groups.map(month => {
              const coverage = monthCoverage(month.days);
              const dataDetail = coverage.missing.length ? ` · ${coverage.daysWithData} com dados` : "";
              return `<section class="history-month">
                  <button type="button" class="month-btn" data-history-month="${month.key}" aria-label="Abrir o resumo de ${escape(month.label)}">
                    <span><b>${escape(month.label)}</b><small>${coverage.periodDays} ${coverage.periodDays === 1 ? "dia" : "dias"} no período${dataDetail}</small></span>
                    <i aria-hidden="true">›</i>
                  </button>
                </section>`;
            }).join("")}
          </div>
        </aside>`;
      }

      const longDate = value => new Intl.DateTimeFormat("pt-BR", {
        day:"2-digit", month:"long", year:"numeric", timeZone:"UTC"
      }).format(new Date(`${value}T12:00:00Z`));
      const compactPeriod = (start, end) => {
        if (!start || !end) return "Escolher período";
        const startDate = new Date(`${start}T12:00:00Z`);
        const endDate = new Date(`${end}T12:00:00Z`);
        const sameYear = start.slice(0,4) === end.slice(0,4);
        const sameMonth = start.slice(0,7) === end.slice(0,7);
        if (start === end) return new Intl.DateTimeFormat("pt-BR", { day:"2-digit", month:"short", year:"numeric", timeZone:"UTC" }).format(startDate);
        if (sameMonth) return `${start.slice(8,10)}–${end.slice(8,10)} ${new Intl.DateTimeFormat("pt-BR", { month:"short", year:"numeric", timeZone:"UTC" }).format(endDate)}`;
        if (sameYear) return `${new Intl.DateTimeFormat("pt-BR", { day:"2-digit", month:"short", timeZone:"UTC" }).format(startDate)} – ${new Intl.DateTimeFormat("pt-BR", { day:"2-digit", month:"short", year:"numeric", timeZone:"UTC" }).format(endDate)}`;
        return `${date(start)} – ${date(end)}`;
      };
      const calendarCells = key => {
        const first = new Date(`${key}-01T12:00:00Z`);
        const offset = first.getUTCDay();
        const next = new Date(first);
        next.setUTCMonth(next.getUTCMonth() + 1);
        const amount = Math.round((next - first) / 86400000);
        return [
          ...Array.from({ length:offset }, () => null),
          ...Array.from({ length:amount }, (_, index) => `${key}-${String(index + 1).padStart(2,"0")}`)
        ];
      };
      const calendarMarkup = (key, secondary = false) => {
        const dataDates = new Set(state.days.map(day => day.date));
        const today = todayIso();
        const selectedStart = state.draftStart;
        const selectedEnd = state.draftEnd;
        const cells = calendarCells(key);
        const weeks = Math.ceil(cells.length / 7);
        while (cells.length < weeks * 7) cells.push(null);
        return `<section class="calendar-panel ${secondary ? "calendar-secondary" : "calendar-primary"}">
          <h3>${escape(monthLabel(`${key}-01`))}</h3>
          <div class="calendar-weekdays" aria-hidden="true">${["D","S","T","Q","Q","S","S"].map(day => `<span>${day}</span>`).join("")}</div>
          <div class="calendar-grid" role="grid" aria-label="${escape(monthLabel(`${key}-01`))}">
            ${cells.map(value => {
              if (!value) return '<span class="calendar-empty" aria-hidden="true"></span>';
              const future = value > today;
              const selected = value === selectedStart || value === selectedEnd;
              const inRange = selectedStart && selectedEnd && value > selectedStart && value < selectedEnd;
              const dataClass = dataDates.has(value) ? "has-data" : "no-data";
              return `<button type="button" data-calendar-day="${value}" class="calendar-day ${dataClass} ${selected ? "selected" : ""} ${inRange ? "in-range" : ""}" ${future ? "disabled" : ""} aria-label="${longDate(value)}${dataDates.has(value) ? ", com dados" : ", sem dados importados"}" aria-pressed="${selected}">${Number(value.slice(8,10))}</button>`;
            }).join("")}
          </div>
        </section>`;
      };
      const datePickerMarkup = () => {
        if (!state.datePickerOpen) return "";
        const secondMonth = monthShift(state.calendarMonth, 1);
        const maxLeftMonth = monthShift(todayIso().slice(0,7), -1);
        return `<div class="date-picker-backdrop" data-close-date-picker></div>
          <section class="date-picker" role="dialog" aria-modal="true" aria-labelledby="date-picker-title">
            <div class="date-presets">
              <h2 id="date-picker-title">Período do painel</h2>
              ${DATE_PRESETS.map(item => `<button type="button" data-date-preset="${item.id}" class="${state.draftPreset === item.id ? "active" : ""}">${item.label}</button>`).join("")}
            </div>
            <div class="date-custom">
              <div class="date-fields" aria-label="Intervalo selecionado">
                <span><small>Data de início</small><strong>${state.draftStart ? date(state.draftStart) : "Selecione"}</strong></span>
                <i aria-hidden="true">→</i>
                <span><small>Data de término</small><strong>${state.draftEnd ? date(state.draftEnd) : "Selecione"}</strong></span>
              </div>
              <div class="calendar-nav">
                <button type="button" data-calendar-shift="-1" aria-label="Meses anteriores">←</button>
                <span>Escolha o início e o fim</span>
                <button type="button" data-calendar-shift="1" aria-label="Meses seguintes" ${state.calendarMonth >= maxLeftMonth ? "disabled" : ""}>→</button>
              </div>
              <div class="calendars">${calendarMarkup(state.calendarMonth)}${calendarMarkup(secondMonth, true)}</div>
              <div class="date-picker-footer">
                <p><span class="legend-data"></span>com dados <span class="legend-empty"></span>sem dados</p>
                <div><button type="button" class="date-cancel" data-cancel-date-picker>Cancelar</button><button type="button" class="date-apply" data-apply-date-picker ${!state.draftStart || !state.draftEnd ? "disabled" : ""}>Aplicar</button></div>
              </div>
            </div>
          </section>`;
      };

      function openDatePicker() {
        state.draftStart = state.start;
        state.draftEnd = state.end;
        state.draftPreset = state.preset;
        state.calendarMonth = monthShift((state.end || todayIso()).slice(0,7), -1);
        state.datePickerOpen = true;
        render({ preserveScroll:true });
      }

      function closeDatePicker() {
        state.datePickerOpen = false;
        render({ preserveScroll:true });
      }

      function render(options = {}) {
        const preserveScroll = Boolean(options.preserveScroll);
        const scrollTop = preserveScroll ? window.scrollY : 0;
        const days = selectedDays();
        const data = state.data;
        const loading = !data;

        if (!state.days.length) {
          APP.innerHTML = '<section class="message"><h2>Não há dias disponíveis</h2><p>Verifique os dados cadastrados no Supabase.</p></section>';
          return;
        }

        const all = data?.daily || [];
        const fallback = totals(all);
        const portfolio = data?.summary?.portfolio || {};
        const metrics = {
          spend:number(portfolio.spend || fallback.spend),
          cost:number(portfolio.cost || fallback.cost),
          revenue:number(portfolio.rev_adj || fallback.revenue),
          profit:number(portfolio.profit || fallback.profit),
          roi:number(portfolio.roi ?? (fallback.cost ? fallback.profit / fallback.cost * 100 : 0))
        };
        const count = number(portfolio.campanhas) || new Set(all.map(row => row.campaign_id)).size;
        const quality = data?.quality || {};
        const partial = quality.dias_parciais || [];
        const qualityCounts = number(quality.inconsistentes) + number(quality.suspeitos);
        const alerts = (data?.alerts || []).slice().sort((a, b) => number(a.prioridade) - number(b.prioridade) || number(b.impacto) - number(a.impacto)).slice(0, 7);
        const revenueByCampaign = new Map();
        all.filter(row => !isResidual(row)).forEach(row => {
          const entry = revenueByCampaign.get(row.campaign_id) || { cap_rev:0, broad_rev:0, rev:0 };
          entry.cap_rev += number(row.cap_rev);
          entry.broad_rev += number(row.broad_rev);
          entry.rev += number(row.rev);
          revenueByCampaign.set(row.campaign_id, entry);
        });
        const ranking = sortRows(
          (data?.ranking || [])
            .map(row => ({ ...row, ...(revenueByCampaign.get(row.campaign_id) || { cap_rev:0, broad_rev:0, rev:0 }) }))
            .filter(row => !state.query || `${row.label} ${row.suffix || ""} ${row.niche || ""}`.toLocaleLowerCase("pt-BR").includes(state.query.toLocaleLowerCase("pt-BR"))),
          state.rankingSort,
          { action:row => row.recomendacao || "acompanhar", trend:row => row.tendencia || "indefinida" }
        );
        const range = state.start && state.end ? `${date(state.start)} → ${date(state.end)}` : "Sem período selecionado";
        const partialNotice = partial.length ? `<div class="notice"><b>⚠</b><span><b>Dados parciais:</b> ${partial.map(escape).join(", ")}. Decisões deste período merecem conferência adicional.</span></div>` : "";
        const qualityNotice = qualityCounts ? `<div class="notice notice-info"><b>i</b><span><b>Qualidade dos dados:</b> ${number(quality.inconsistentes)} inconsistência(s) e ${number(quality.suspeitos)} registro(s) suspeito(s) no período.</span></div>` : "";
        const insightNote = state.insightsUnavailable ? '<p class="insight-note">Os indicadores avançados estão temporariamente indisponíveis; os KPIs, o histórico e os cálculos do período continuam atualizados.</p>' : "";

        APP.innerHTML = `<header class="topbar">
          <div class="brand"><div class="mark">Df</div><div><p class="eyebrow">DIZZ 1 WAVE</p><h1>DASHFULL</h1><p class="subtitle">Performance diária, com decisões claras.</p></div></div>
          <div class="date-control">
            <button type="button" class="date-trigger" data-date-picker-trigger aria-haspopup="dialog" aria-expanded="${state.datePickerOpen}" aria-label="Alterar período do painel">
              <span class="calendar-icon" aria-hidden="true"></span><span class="date-trigger-label">${compactPeriod(state.start, state.end)}</span>
            </button>
            ${datePickerMarkup()}
          </div>
        </header>
        <div class="workspace">
          ${historyMarkup()}
          <div class="main">
            <p class="context"><strong>${range}</strong><span class="separator">•</span><span>${days.length} ${days.length === 1 ? "dia com dados" : "dias com dados"}</span>${loading ? '<span class="separator">•</span><span>Atualizando…</span>' : ""}</p>
            ${partialNotice}${qualityNotice}${insightNote}
            <section class="metrics">
              <article class="metric"><div class="metric-label">Gasto total</div><div class="metric-value">${money(metrics.spend)}</div><div class="metric-foot">${count} campanhas com resultado</div></article>
              <article class="metric"><div class="metric-label">Receita líquida</div><div class="metric-value positive">${money(metrics.revenue)}</div><div class="metric-foot">Após os ajustes de receita aplicados</div></article>
              <article class="metric"><div class="metric-label">Lucro</div><div class="metric-value ${tone(metrics.profit)}">${money(metrics.profit)}</div><div class="metric-foot">Custo total: ${money(metrics.cost)}</div></article>
              <article class="metric"><div class="metric-label">ROI</div><div class="metric-value ${tone(metrics.roi)}">${roiText(metrics.cost ? metrics.roi : metrics.revenue > 0 ? null : undefined)}</div><div class="metric-foot">Retorno sobre o custo total</div></article>
            </section>
            <section class="content">
              <article class="panel">
                <div class="panel-head"><div><h2>Evolução diária</h2><p>Gasto e receita em barras; lucro em linha.</p></div><div class="legend"><span><i style="background:#bfd0f7"></i>Gasto</span><span><i style="background:#84ceb4"></i>Receita</span><span><i style="background:#245dd8"></i>Lucro</span></div></div>
                <div class="chart">${chart(all)}</div>
              </article>
              <article class="panel">
                <div class="panel-head"><div><h2>Agir agora</h2><p>Sugestões ordenadas por impacto financeiro.</p></div></div>
                <div class="alerts">${alerts.length ? alerts.map(alert => `<button type="button" class="alert" data-campaign="${alert.campaign_id}"><span class="tag ${statusClass(alert.tipo)}">${escape(alert.tipo)}</span><span><span class="alert-title">${escape(alert.label)}</span><span class="alert-detail">${escape(alert.detalhe)}</span></span><span class="impact ${tone(alert.impacto)}"><small>Impacto</small>${money(alert.impacto)}</span></button>`).join("") : '<div class="empty">Nenhuma ação pendente neste período.</div>'}</div>
              </article>
            </section>
            <section class="panel table-panel">
              <div class="panel-head"><div><h2>Ranking de campanhas</h2><p>Clique em uma campanha para abrir o demonstrativo completo.</p></div><div class="table-tools"><input id="search" value="${escape(state.query)}" placeholder="Buscar campanha, nicho ou código" aria-label="Buscar campanha" /></div></div>
              <div class="scroller"><table><thead><tr>
                ${sortableHead("Campanha", "label", state.rankingSort, "ranking")}
                ${sortableHead("Gasto", "spend", state.rankingSort, "ranking")}
                ${sortableHead("Rec. Cap", "cap_rev", state.rankingSort, "ranking")}
                ${sortableHead("Rec. Broad", "broad_rev", state.rankingSort, "ranking")}
                ${sortableHead("Rec. Bruta", "rev", state.rankingSort, "ranking")}
                ${sortableHead("Rec. Líq.", "rev_adj", state.rankingSort, "ranking")}
                ${sortableHead("Lucro", "profit", state.rankingSort, "ranking")}
                ${sortableHead("ROI", "roi", state.rankingSort, "ranking")}
                ${sortableHead("Tendência", "trend", state.rankingSort, "ranking")}
                ${sortableHead("Ação", "action", state.rankingSort, "ranking")}
              </tr></thead><tbody>
                ${ranking.length ? ranking.map(row => {
                  const recommendation = String(row.recomendacao || "acompanhar");
                  const trend = String(row.tendencia || "indefinida");
                  return `<tr data-campaign="${row.campaign_id}"><td class="campaign">${escape(row.label)}</td><td>${moneyPrecise(row.spend)}</td><td>${moneyPrecise(row.cap_rev)}</td><td>${moneyPrecise(row.broad_rev)}</td><td>${moneyPrecise(row.rev)}</td><td>${moneyPrecise(row.rev_adj)}</td><td class="${tone(row.profit)}">${moneyPrecise(row.profit)}</td><td class="${tone(row.roi)}">${roiText(number(row.cost) ? row.roi : number(row.rev_adj) > 0 ? null : undefined)}</td><td class="trend">${trend === "subindo" ? "↑" : trend === "caindo" ? "↓" : "→"} ${escape(trend)}</td><td><span class="reco ${statusClass(recommendation)}">${escape(recommendation.replaceAll("_", " "))}</span></td></tr>`;
                }).join("") : '<tr><td colspan="10"><div class="empty">Nenhuma campanha encontrada neste período.</div></td></tr>'}
              </tbody></table></div>
            </section>
            <p class="source">Dados consolidados do Supabase. O painel principal usa exclusivamente campanhas de mensagens; alertas e ranking avançado são enriquecidos sem bloquear a visualização.</p>
          </div>
        </div>`;

        bind();
        if (preserveScroll) requestAnimationFrame(() => window.scrollTo({ top:scrollTop, behavior:"auto" }));
      }

      function bind() {
        document.querySelector("[data-date-picker-trigger]")?.addEventListener("click", () => {
          if (state.datePickerOpen) closeDatePicker();
          else openDatePicker();
        });
        document.querySelector("[data-close-date-picker]")?.addEventListener("click", closeDatePicker);
        document.querySelector("[data-cancel-date-picker]")?.addEventListener("click", closeDatePicker);
        document.querySelectorAll("[data-date-preset]").forEach(button => button.addEventListener("click", () => {
          const preset = button.dataset.datePreset;
          state.draftPreset = preset;
          if (preset !== "custom") {
            const period = periodForPreset(preset);
            state.draftStart = period.start;
            state.draftEnd = period.end;
            state.calendarMonth = monthShift(period.end.slice(0,7), -1);
          }
          render({ preserveScroll:true });
        }));
        document.querySelectorAll("[data-calendar-shift]").forEach(button => button.addEventListener("click", () => {
          state.calendarMonth = monthShift(state.calendarMonth, Number(button.dataset.calendarShift));
          render({ preserveScroll:true });
        }));
        document.querySelectorAll("[data-calendar-day]").forEach(button => button.addEventListener("click", () => {
          const picked = button.dataset.calendarDay;
          if (state.draftPreset !== "custom" || !state.draftStart || state.draftEnd) {
            state.draftStart = picked;
            state.draftEnd = "";
          } else if (picked < state.draftStart) {
            state.draftEnd = state.draftStart;
            state.draftStart = picked;
          } else {
            state.draftEnd = picked;
          }
          state.draftPreset = "custom";
          render({ preserveScroll:true });
        }));
        document.querySelector("[data-apply-date-picker]")?.addEventListener("click", () => {
          if (!state.draftStart || !state.draftEnd) return;
          state.start = state.draftStart;
          state.end = state.draftEnd;
          state.preset = state.draftPreset;
          state.datePickerOpen = false;
          syncHash();
          load({ preserveScroll:true });
        });
        document.querySelector(".date-picker")?.addEventListener("keydown", event => {
          if (event.key === "Escape") closeDatePicker();
        });

        document.getElementById("search")?.addEventListener("input", event => {
          state.query = event.target.value;
          render({ preserveScroll:true });
        });

        document.querySelectorAll("[data-history-month]").forEach(button => button.addEventListener("click", () => {
          openMonthModal(button.dataset.historyMonth, button);
        }));

        document.querySelectorAll("[data-ranking-sort]").forEach(button => button.addEventListener("click", () => {
          const key = button.dataset.rankingSort;
          state.rankingSort = {
            key,
            direction:state.rankingSort.key === key && state.rankingSort.direction === "asc" ? "desc" : "asc"
          };
          render({ preserveScroll:true });
        }));

        document.querySelectorAll("[data-campaign]").forEach(row => row.addEventListener("click", () => openCampaignModal(Number(row.dataset.campaign), row)));
      }

      const currentRoute = () => state.modalStack.at(-1);
      const calendarDays = (amount, endDate) => Array.from({ length:amount }, (_, index) => ({
        date:isoShift(endDate, index - amount + 1)
      }));
      const daysEqual = (first, second) => first.length === second.length
        && first.every((day, index) => day.date === second[index]?.date);
      const rowsForDate = (rows, target) => rows.filter(row => row.date === target);
      const rowsForRange = (rows, start, end) => rows.filter(row => row.date >= start && row.date <= end);
      const roiForDate = (rows, target) => {
        const picked = rowsForDate(rows, target);
        return picked.length ? totalRoi(picked) : undefined;
      };
      const roiForRange = (rows, start, end) => {
        const picked = rowsForRange(rows, start, end);
        return picked.length ? totalRoi(picked) : undefined;
      };
      const comparisonCell = value => value === undefined ? "—" : roiText(value);

      async function loadMonthData(key) {
        const cached = state.monthCache.get(key);
        if (cached) return await cached;
        const bounds = monthBounds(key);
        const monthDays = monthDaysForKey(key);
        const request = apiAll(`v_daily?typ=eq.msgs&date=gte.${bounds.contextStart}&date=lt.${bounds.end}&select=${DAILY_FIELDS}&order=date.asc,campaign_id.asc`)
          .then(contextRows => ({
            contextRows,
            monthRows:contextRows.filter(row => row.date >= bounds.start && row.date < bounds.end),
            bounds,
            monthDays
          }))
          .catch(error => {
            state.monthCache.delete(key);
            throw error;
          });
        state.monthCache.set(key, request);
        const result = await request;
        state.monthCache.set(key, result);
        return result;
      }

      async function loadCampaignData(id) {
        const key = String(id);
        const cached = state.campaignCache.get(key);
        if (cached) return await cached;
        const request = apiAll(`v_daily?typ=eq.msgs&campaign_id=eq.${id}&select=${DAILY_FIELDS}&order=date.asc`)
          .catch(error => {
            state.campaignCache.delete(key);
            throw error;
          });
        state.campaignCache.set(key, request);
        const result = await request;
        state.campaignCache.set(key, result);
        return result;
      }

      function monthSummary(data) {
        const grouped = new Map();
        data.monthRows.forEach(row => {
          const group = grouped.get(row.date) || { date:row.date, di:row.di, rows:[] };
          group.rows.push(row);
          grouped.set(row.date, group);
        });
        return (data.monthDays?.length ? data.monthDays : [...grouped.values()]).map(day => {
          const group = grouped.get(day.date);
          if (!group) {
            return {
              date:day.date,
              di:day.di,
              campaigns:0,
              spend:0,
              cost:0,
              cap_rev:0,
              broad_rev:0,
              rev:0,
              rev_adj:0,
              profit:0,
              roi:null,
              d1:roiForDate(data.contextRows, isoShift(day.date, -1)),
              d2:roiForDate(data.contextRows, isoShift(day.date, -2)),
              last7:roiForRange(data.contextRows, isoShift(day.date, -6), day.date),
              last14:roiForRange(data.contextRows, isoShift(day.date, -13), day.date),
              hasData:false
            };
          }
          const metrics = totals(group.rows);
          return {
            date:group.date,
            di:group.di,
            campaigns:new Set(group.rows.map(row => row.campaign_id)).size,
            spend:metrics.spend,
            cost:metrics.cost,
            cap_rev:metrics.capRev,
            broad_rev:metrics.broadRev,
            rev:metrics.gross,
            rev_adj:metrics.revenue,
            profit:metrics.profit,
            roi:metrics.cost ? metrics.profit / metrics.cost * 100 : metrics.revenue > 0 ? null : undefined,
            d1:roiForDate(data.contextRows, isoShift(group.date, -1)),
            d2:roiForDate(data.contextRows, isoShift(group.date, -2)),
            last7:roiForRange(data.contextRows, isoShift(group.date, -6), group.date),
            last14:roiForRange(data.contextRows, isoShift(group.date, -13), group.date),
            hasData:true
          };
        });
      }

      function dayCampaignRows(route) {
        const term = (route.search || "").toLocaleLowerCase("pt-BR").trim();
        const rows = route.contextRows
          .filter(row => number(row.di) === number(route.di))
          .filter(row => !term || `${row.label} ${row.suffix || ""} ${row.niche || ""}`.toLocaleLowerCase("pt-BR").includes(term));
        return rows.map(row => {
          const history = route.contextRows.filter(item => Number(item.campaign_id) === Number(row.campaign_id));
          return {
            ...row,
            calculatedRoi:roiForRow(row),
            d1:roiForDate(history, isoShift(row.date, -1)),
            d2:roiForDate(history, isoShift(row.date, -2)),
            last7:roiForRange(history, isoShift(row.date, -6), row.date),
            last14:roiForRange(history, isoShift(row.date, -13), row.date)
          };
        });
      }

      function modalWindow(rows, scope, anchorDi) {
        const sorted = rows.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
        const panelDays = selectedDays();
        const anchorDate = state.days.find(day => number(day.di) === number(anchorDi))?.date
          || panelDays.at(-1)?.date
          || sorted.at(-1)?.date;
        let expectedDays = panelDays;
        let label = "Período do painel";

        if (scope === "complete") {
          const uniqueDays = [...new Set(sorted.map(row => row.date))].map(date => ({ date }));
          return {
            rows:sorted,
            expectedDays:uniqueDays,
            label:"Histórico completo",
            range:sorted.length ? `${date(sorted[0].date)} → ${date(sorted.at(-1).date)}` : "Sem dados",
            isComplete:true,
            anchorDate
          };
        }

        if (scope !== "panel") {
          const amount = Number(scope);
          expectedDays = anchorDate ? calendarDays(amount, anchorDate) : [];
          label = `${amount} ${amount === 1 ? "dia" : "dias"}`;
        }

        const expectedDates = new Set(expectedDays.map(day => day.date));
        return {
          rows:sorted.filter(row => expectedDates.has(row.date)),
          expectedDays,
          label,
          range:expectedDays.length ? `${date(expectedDays[0].date)} → ${date(expectedDays.at(-1).date)}` : "Sem dados",
          isComplete:false,
          anchorDate
        };
      }

      function roiForDays(rows, days) {
        const expectedDates = new Set(days.map(day => day.date));
        const picked = rows.filter(row => expectedDates.has(row.date));
        const all = totals(picked);
        const coverage = new Set(picked.map(row => row.date)).size;
        return picked.length ? { roi:all.cost ? all.profit / all.cost * 100 : all.revenue > 0 ? null : undefined, coverage, requested:days.length } : null;
      }

      function compare(label, value) {
        return `<div class="comparison"><span>${label}</span><strong class="${tone(value?.roi)}">${!value ? "Não rodou" : roiText(value.roi)}</strong>${value && value.coverage < value.requested ? `<small>${value.coverage}/${value.requested} dias com dados</small>` : ""}</div>`;
      }

      function comparisonMarkup(rows, selectedWindow) {
        if (!selectedWindow.anchorDate) return "";
        const oneDayBefore = [{ date:isoShift(selectedWindow.anchorDate, -1) }];
        const twoDaysBefore = [{ date:isoShift(selectedWindow.anchorDate, -2) }];
        const lastSeven = calendarDays(7, selectedWindow.anchorDate);
        const lastFourteen = calendarDays(14, selectedWindow.anchorDate);
        const cards = [
          compare("D-1", roiForDays(rows, oneDayBefore)),
          compare("D-2", roiForDays(rows, twoDaysBefore))
        ];
        if (!daysEqual(selectedWindow.expectedDays, lastSeven)) cards.push(compare("Últimos 7", roiForDays(rows, lastSeven)));
        if (!daysEqual(selectedWindow.expectedDays, lastFourteen)) cards.push(compare("Últimos 14", roiForDays(rows, lastFourteen)));
        return `<div class="comparisons" aria-label="Comparativos de ROI">${cards.join("")}</div>`;
      }

      function saveRoutePosition() {
        const route = currentRoute();
        const panel = document.querySelector("[data-nav-panel]");
        const scroller = document.querySelector("[data-route-scroller]");
        if (!route) return;
        route.scrollTop = panel?.scrollTop || 0;
        route.tableScrollTop = scroller?.scrollTop || 0;
        route.tableScrollLeft = scroller?.scrollLeft || 0;
      }

      function restoreRoutePosition(route) {
        requestAnimationFrame(() => {
          const panel = document.querySelector("[data-nav-panel]");
          const scroller = document.querySelector("[data-route-scroller]");
          if (panel) panel.scrollTop = route.scrollTop || 0;
          if (scroller) {
            scroller.scrollTop = route.tableScrollTop || 0;
            scroller.scrollLeft = route.tableScrollLeft || 0;
          }
        });
      }

      function beginModalSession(opener) {
        if (state.modalStack.length) {
          saveRoutePosition();
          return;
        }
        state.modalBaseScroll = window.scrollY;
        state.modalOpener = opener;
      }

      function pushModalRoute(route, opener) {
        beginModalSession(opener);
        route.scrollTop = 0;
        route.tableScrollTop = 0;
        route.tableScrollLeft = 0;
        state.modalStack.push(route);
        renderNavigationModal({ focusPrimary:true });
      }

      function modalBack() {
        if (state.modalStack.length <= 1) return;
        saveRoutePosition();
        state.modalStack.pop();
        renderNavigationModal();
      }

      function closeNavigationModal(options = {}) {
        if (!state.modalStack.length) return;
        const opener = state.modalOpener;
        document.querySelector("[data-nav-modal-root]")?.remove();
        state.modalStack = [];
        window.scrollTo({ top:state.modalBaseScroll, behavior:"auto" });
        if (options.restoreFocus !== false) opener?.focus?.({ preventScroll:true });
      }

      function activateDrillRow(row, callback) {
        row.addEventListener("click", callback);
        row.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            callback();
          }
        });
      }

      function monthModalMarkup(route) {
        if (route.loading) return '<div class="modal-heading"><p class="eyebrow">RESUMO MENSAL</p><h2 class="detail-name" id="nav-modal-title">Carregando mês…</h2></div><div class="modal-loading">Preparando os resultados do mês.</div>';
        if (route.error) return `<div class="modal-heading"><p class="eyebrow">RESUMO MENSAL</p><h2 class="detail-name" id="nav-modal-title">${escape(route.label)}</h2></div><div class="modal-error">Não foi possível carregar este mês. Feche o pop-up e tente novamente.</div>`;

        const getters = { d1:row => row.d1, d2:row => row.d2, last7:row => row.last7, last14:row => row.last14 };
        const rows = sortRows(monthSummary(route.data), route.sort, getters);
        const coverage = monthCoverage(route.data.monthDays || rows);
        const coverageLabel = coverage.missing.length
          ? `${coverage.periodDays} dias no período · ${coverage.daysWithData} com dados`
          : `${coverage.periodDays} ${coverage.periodDays === 1 ? "dia" : "dias"} no período`;
        const missingLabel = coverage.missing.map(date).join(", ");
        return `<div class="modal-heading">
            <p class="eyebrow">RESUMO MENSAL</p>
            <h2 class="detail-name" id="nav-modal-title">${escape(route.label)}</h2>
            <p class="detail-sub">${coverageLabel}. Clique em um dia com dados para visualizar suas campanhas.</p>
          </div>
          ${coverage.missing.length ? `<p class="coverage-warning"><strong>Atenção:</strong> ainda não há dados importados para ${missingLabel}.</p>` : ""}
          <p class="tax-note">Custo = gasto do Meta Ads + 13% de imposto. Receita líquida = GAM − 10% de Rev Share. ROI calculado sobre o custo total.</p>
          <div class="scroller" data-route-scroller><table class="month-table"><thead><tr>
            ${sortableHead("Data", "date", route.sort)}
            ${sortableHead("Campanhas", "campaigns", route.sort)}
            ${sortableHead("Gasto", "spend", route.sort)}
            ${sortableHead("Custo", "cost", route.sort)}
            ${sortableHead("Rec. Cap", "cap_rev", route.sort)}
            ${sortableHead("Rec. Broad", "broad_rev", route.sort)}
            ${sortableHead("Rec. Bruta", "rev", route.sort)}
            ${sortableHead("Rec. Líq.", "rev_adj", route.sort)}
            ${sortableHead("Lucro", "profit", route.sort)}
            ${sortableHead("ROI", "roi", route.sort)}
            ${sortableHead("D-1", "d1", route.sort)}
            ${sortableHead("D-2", "d2", route.sort)}
            ${sortableHead("Últ. 7", "last7", route.sort)}
            ${sortableHead("Últ. 14", "last14", route.sort)}
          </tr></thead><tbody>
            ${rows.map(row => row.hasData
              ? `<tr class="drill-row" tabindex="0" role="button" data-month-day="${row.di}" aria-label="Abrir ${row.campaigns} campanhas de ${date(row.date)}">
                  <td><span class="drill-link">${date(row.date)}</span></td>
                  <td>${row.campaigns} campanhas</td>
                  <td>${moneyPrecise(row.spend)}</td>
                  <td>${moneyPrecise(row.cost)}</td>
                  <td>${moneyPrecise(row.cap_rev)}</td>
                  <td>${moneyPrecise(row.broad_rev)}</td>
                  <td>${moneyPrecise(row.rev)}</td>
                  <td>${moneyPrecise(row.rev_adj)}</td>
                  <td class="${tone(row.profit)}">${moneyPrecise(row.profit)}</td>
                  <td class="${tone(row.roi)}">${roiText(row.roi)}</td>
                  <td class="${tone(row.d1)}">${comparisonCell(row.d1)}</td>
                  <td class="${tone(row.d2)}">${comparisonCell(row.d2)}</td>
                  <td class="${tone(row.last7)}">${comparisonCell(row.last7)}</td>
                  <td class="${tone(row.last14)}">${comparisonCell(row.last14)}</td>
                </tr>`
              : `<tr class="missing-day-row" aria-label="${date(row.date)} ainda sem dados importados">
                  <td>${date(row.date)}</td>
                  <td>Sem dados</td>
                  <td>—</td>
                  <td>—</td>
                  <td>—</td>
                  <td>—</td>
                  <td>—</td>
                  <td>—</td>
                  <td>—</td>
                  <td>—</td>
                  <td class="${tone(row.d1)}">${comparisonCell(row.d1)}</td>
                  <td class="${tone(row.d2)}">${comparisonCell(row.d2)}</td>
                  <td class="${tone(row.last7)}">${comparisonCell(row.last7)}</td>
                  <td class="${tone(row.last14)}">${comparisonCell(row.last14)}</td>
                </tr>`).join("")}
          </tbody></table></div>`;
      }

      function dayModalMarkup(route) {
        const day = state.days.find(item => number(item.di) === number(route.di));
        const rawRows = route.contextRows.filter(row => number(row.di) === number(route.di));
        const operationalRows = rawRows.filter(row => !isResidual(row));
        const residualRows = rawRows.filter(isResidual);
        const metrics = totals(rawRows);
        const operationalMetrics = totals(operationalRows);
        const roi = metrics.cost ? metrics.profit / metrics.cost * 100 : metrics.revenue > 0 ? null : undefined;
        const missingMetaSpend = operationalRows.length > 0 && operationalMetrics.spend === 0 && operationalMetrics.gross > 0;
        const getters = { roi:row => row.calculatedRoi, d1:row => row.d1, d2:row => row.d2, last7:row => row.last7, last14:row => row.last14 };
        const rows = sortRows(dayCampaignRows(route), route.sort, getters);
        return `<div class="modal-heading">
            <p class="eyebrow">CAMPANHAS DO DIA</p>
            <h2 class="detail-name" id="nav-modal-title">${date(day?.date)}</h2>
            <p class="detail-sub">${rows.length} ${rows.length === 1 ? "campanha registrada" : "campanhas registradas"} neste dia${route.search ? ` · filtro "${escape(route.search)}" ativo` : ""}. Clique em uma campanha para abrir o demonstrativo completo.</p>
          </div>
          <div class="detail-metrics" aria-label="Resumo financeiro de ${date(day?.date)}">
            <div class="detail-metric"><span>Gasto total</span><strong>${moneyPrecise(metrics.spend)}</strong></div>
            <div class="detail-metric"><span>Custo total</span><strong>${moneyPrecise(metrics.cost)}</strong></div>
            <div class="detail-metric"><span>Rec. Cap</span><strong>${moneyPrecise(metrics.capRev)}</strong></div>
            <div class="detail-metric"><span>Rec. Broad</span><strong>${moneyPrecise(metrics.broadRev)}</strong></div>
            <div class="detail-metric"><span>Rec. Bruta</span><strong>${moneyPrecise(metrics.gross)}</strong></div>
            <div class="detail-metric"><span>Rec. líquida</span><strong class="positive">${moneyPrecise(metrics.revenue)}</strong></div>
            <div class="detail-metric"><span>Lucro</span><strong class="${tone(metrics.profit)}">${moneyPrecise(metrics.profit)}</strong></div>
            <div class="detail-metric"><span>ROI</span><strong class="${tone(roi)}">${roiText(roi)}</strong></div>
          </div>
          ${missingMetaSpend ? '<p class="coverage-warning"><strong>Atenção:</strong> há receita de campanha ativa sem gasto do Meta Ads registrado neste dia. Confirme o arquivo do Meta Ads antes de interpretar o símbolo ∞ como retorno real.</p>' : ""}
          ${residualRows.length ? `<p class="residual-note">${residualRows.length} ${residualRows.length === 1 ? "linha contém" : "linhas contêm"} apenas receita residual de sufixo sem campanha ativa.</p>` : ""}
          <p class="tax-note">Custo = gasto do Meta Ads + 13% de imposto. Receita líquida = GAM − 10% de Rev Share.</p>
          <div class="table-tools"><input data-day-search value="${escape(route.search || "")}" placeholder="Buscar campanha, nicho ou código (ex: MX)" aria-label="Buscar campanha no dia" /></div>
          <div class="scroller" data-route-scroller><table class="day-table"><thead><tr>
            ${sortableHead("Campanha", "label", route.sort)}
            ${sortableHead("Gasto", "spend", route.sort)}
            ${sortableHead("Custo", "cost", route.sort)}
            ${sortableHead("Rec. Cap", "cap_rev", route.sort)}
            ${sortableHead("Rec. Broad", "broad_rev", route.sort)}
            ${sortableHead("Rec. Bruta", "rev", route.sort)}
            ${sortableHead("Rec. Líq.", "rev_adj", route.sort)}
            ${sortableHead("Lucro", "profit", route.sort)}
            ${sortableHead("ROI", "roi", route.sort)}
            ${sortableHead("D-1", "d1", route.sort)}
            ${sortableHead("D-2", "d2", route.sort)}
            ${sortableHead("Últ. 7", "last7", route.sort)}
            ${sortableHead("Últ. 14", "last14", route.sort)}
            ${sortableHead("Status", "status", route.sort)}
          </tr></thead><tbody>
            ${rows.length ? rows.map(row => `<tr class="drill-row" tabindex="0" role="button" data-day-campaign="${row.campaign_id}" aria-label="Abrir detalhes de ${escape(row.label)}">
              <td class="campaign">${campaignName(row)}</td>
              <td>${moneyPrecise(row.spend)}</td>
              <td>${moneyPrecise(row.cost)}</td>
              <td>${moneyPrecise(row.cap_rev)}</td>
              <td>${moneyPrecise(row.broad_rev)}</td>
              <td>${moneyPrecise(row.rev)}</td>
              <td>${moneyPrecise(row.rev_adj)}</td>
              <td class="${tone(row.profit)}">${moneyPrecise(row.profit)}</td>
              <td class="${tone(row.calculatedRoi)}">${roiText(row.calculatedRoi)}</td>
              <td class="${tone(row.d1)}">${comparisonCell(row.d1)}</td>
              <td class="${tone(row.d2)}">${comparisonCell(row.d2)}</td>
              <td class="${tone(row.last7)}">${comparisonCell(row.last7)}</td>
              <td class="${tone(row.last14)}">${comparisonCell(row.last14)}</td>
              <td><span class="drawer-status"><i class="dot ${statusClass(row.status)}"></i>${escape(row.status || "sem status")}</span></td>
            </tr>`).join("") : `<tr><td colspan="14"><div class="empty">Nenhuma campanha corresponde a "${escape(route.search || "")}" neste dia.</div></td></tr>`}
          </tbody></table></div>`;
      }

      function campaignMeta(id, rows) {
        return (state.data?.ranking || []).find(row => Number(row.campaign_id) === Number(id)) || rows[0] || {};
      }

      function campaignModalMarkup(route) {
        if (!route.rows.length && route.loading) return '<div class="modal-heading"><p class="eyebrow">DEMONSTRATIVO DA CAMPANHA</p><h2 class="detail-name" id="nav-modal-title">Carregando campanha…</h2></div><div class="modal-loading">Preparando o histórico da campanha.</div>';
        if (!route.rows.length) return '<div class="modal-heading"><p class="eyebrow">DEMONSTRATIVO DA CAMPANHA</p><h2 class="detail-name" id="nav-modal-title">Campanha indisponível</h2></div><div class="modal-error">Não foi possível carregar os dados desta campanha.</div>';

        const selected = modalWindow(route.rows, route.scope, route.anchorDi);
        const campaign = campaignMeta(route.id, route.rows);
        const metrics = totals(selected.rows);
        const residualDays = selected.rows.filter(isResidual);
        const anchorResidual = route.anchorDi !== null && route.anchorDi !== undefined
          ? route.rows.some(row => number(row.di) === number(route.anchorDi) && isResidual(row))
          : selected.rows.length > 0 && residualDays.length === selected.rows.length;
        const roi = metrics.cost ? metrics.profit / metrics.cost * 100 : metrics.revenue > 0 ? null : undefined;
        const latest = selected.rows.at(-1);
        const coverage = new Set(selected.rows.map(row => row.date)).size;
        const scopeButtons = MODAL_SCOPES.map(item => `<button type="button" data-modal-scope="${item.id}" class="${route.scope === item.id ? "active" : ""}" ${route.loading && item.id !== "panel" ? "disabled" : ""}>${item.label}</button>`).join("");
        const tableRows = sortRows(selected.rows.map(row => ({ ...row, calculatedRoi:roiForRow(row) })), route.sort, { roi:row => row.calculatedRoi });
        return `<div class="modal-heading">
            <p class="eyebrow">DEMONSTRATIVO DA CAMPANHA</p>
            <h2 class="detail-name" id="nav-modal-title">${escape(campaign.label)}${anchorResidual ? residualLabel : ""}</h2>
            <p class="detail-sub">${escape(campaign.suffix || campaign.niche || "Campanha de mensagens")}</p>
          </div>
          <div class="modal-scopes" aria-label="Período do demonstrativo">${scopeButtons}</div>
          <p class="modal-period">${escape(selected.label)} · ${selected.range}</p>
          <p class="modal-note">${selected.isComplete ? `${coverage} dias com dados no histórico` : `${coverage} de ${selected.expectedDays.length} dias com dados`}</p>
          ${route.loading ? '<p class="modal-note">O histórico completo está sendo carregado em segundo plano.</p>' : ""}
          ${route.error ? '<div class="modal-error">O período disponível foi mantido, mas o histórico completo não pôde ser atualizado.</div>' : ""}
          ${residualDays.length ? `<p class="residual-note">${residualDays.length} ${residualDays.length === 1 ? "dia de receita residual está incluído" : "dias de receita residual estão incluídos"} neste demonstrativo.</p>` : ""}
          <div class="detail-metrics">
            <div class="detail-metric"><span>Gasto</span><strong>${money(metrics.spend)}</strong></div>
            <div class="detail-metric"><span>Custo</span><strong>${money(metrics.cost)}</strong></div>
            <div class="detail-metric"><span>Rec. Cap</span><strong>${money(metrics.capRev)} <small>(${metrics.gross ? Math.round(metrics.capRev / metrics.gross * 100) : 0}%)</small></strong></div>
            <div class="detail-metric"><span>Rec. Broad</span><strong>${money(metrics.broadRev)} <small>(${metrics.gross ? Math.round(metrics.broadRev / metrics.gross * 100) : 0}%)</small></strong></div>
            <div class="detail-metric"><span>Rec. Bruta</span><strong>${money(metrics.gross)}</strong></div>
            <div class="detail-metric"><span>Rec. líquida</span><strong>${money(metrics.revenue)}</strong></div>
            <div class="detail-metric"><span>Lucro</span><strong class="${tone(metrics.profit)}">${money(metrics.profit)}</strong></div>
            <div class="detail-metric"><span>ROI</span><strong class="${tone(roi)}">${roiText(roi)}</strong></div>
          </div>
          <p class="tax-note">Custo = gasto do Meta Ads + 13% de imposto. Receita líquida = GAM − 10% de Rev Share.</p>
          <p class="detail-status"><i class="dot ${statusClass(latest?.status)}"></i>Status no último dia do período: <strong>${escape(latest?.status || "sem status")}</strong></p>
          ${comparisonMarkup(route.rows, selected)}
          <section class="modal-chart">
            <h3>Evolução diária</h3>
            <p>Gasto e receita em barras; lucro em linha.</p>
            <div class="chart">${chart(selected.rows, `Evolução diária de ${campaign.label}`)}</div>
          </section>
          <div class="scroller" data-route-scroller><table><thead><tr>
            ${sortableHead("Data", "date", route.sort)}
            ${sortableHead("Gasto", "spend", route.sort)}
            ${sortableHead("Custo", "cost", route.sort)}
            ${sortableHead("Rec. Cap", "cap_rev", route.sort)}
            ${sortableHead("Rec. Broad", "broad_rev", route.sort)}
            ${sortableHead("Rec. Bruta", "rev", route.sort)}
            ${sortableHead("Rec. Líq.", "rev_adj", route.sort)}
            ${sortableHead("Lucro", "profit", route.sort)}
            ${sortableHead("ROI", "roi", route.sort)}
            ${sortableHead("Status", "status", route.sort)}
          </tr></thead><tbody>
            ${tableRows.length ? tableRows.map(row => `<tr>
              <td>${date(row.date)}</td>
              <td>${moneyPrecise(row.spend)}</td>
              <td>${moneyPrecise(row.cost)}</td>
              <td>${moneyPrecise(row.cap_rev)}</td>
              <td>${moneyPrecise(row.broad_rev)}</td>
              <td>${moneyPrecise(row.rev)}</td>
              <td>${moneyPrecise(row.rev_adj)}</td>
              <td class="${tone(row.profit)}">${moneyPrecise(row.profit)}</td>
              <td class="${tone(row.calculatedRoi)}">${roiText(row.calculatedRoi)}</td>
              <td><span class="drawer-status"><i class="dot ${statusClass(row.status)}"></i>${escape(row.status || "sem status")}</span></td>
            </tr>`).join("") : '<tr><td colspan="10"><div class="empty">Esta campanha não possui resultado neste período.</div></td></tr>'}
          </tbody></table></div>`;
      }

      function renderNavigationModal(options = {}) {
        const route = currentRoute();
        document.querySelector("[data-nav-modal-root]")?.remove();
        if (!route) return;
        const content = route.kind === "month" ? monthModalMarkup(route) : route.kind === "day" ? dayModalMarkup(route) : campaignModalMarkup(route);
        const root = document.createElement("div");
        root.className = "modal-root";
        root.setAttribute("data-nav-modal-root", "true");
        root.innerHTML = `<div class="modal-backdrop"></div>
          <section class="modal nav-modal" data-nav-panel role="dialog" aria-modal="true" aria-labelledby="nav-modal-title">
            <button type="button" class="modal-back" data-modal-back aria-label="Voltar ao pop-up anterior" ${state.modalStack.length > 1 ? "" : "hidden"}>←</button>
            <button type="button" class="modal-close" data-close-navigation aria-label="Fechar todos os pop-ups">×</button>
            ${content}
          </section>`;
        document.body.append(root);

        root.querySelector("[data-close-navigation]")?.addEventListener("click", () => closeNavigationModal());
        root.querySelector("[data-modal-back]")?.addEventListener("click", modalBack);
        root.querySelectorAll("[data-modal-sort]").forEach(button => button.addEventListener("click", () => {
          saveRoutePosition();
          const key = button.dataset.modalSort;
          route.sort = { key, direction:route.sort.key === key && route.sort.direction === "asc" ? "desc" : "asc" };
          renderNavigationModal();
        }));
        const daySearchInput = root.querySelector("[data-day-search]");
        if (daySearchInput) {
          daySearchInput.addEventListener("input", event => {
            route.search = event.target.value;
            const cursor = event.target.selectionStart;
            renderNavigationModal();
            const restored = document.querySelector("[data-day-search]");
            if (restored) {
              restored.focus();
              restored.setSelectionRange(cursor, cursor);
            }
          });
        }
        root.querySelectorAll("[data-month-day]").forEach(row => activateDrillRow(row, () => openDayFromMonth(Number(row.dataset.monthDay))));
        root.querySelectorAll("[data-day-campaign]").forEach(row => activateDrillRow(row, () => openCampaignModal(Number(row.dataset.dayCampaign), row, { scope:"1", anchorDi:route.di })));
        root.querySelectorAll("[data-modal-scope]").forEach(button => button.addEventListener("click", () => {
          saveRoutePosition();
          route.scope = button.dataset.modalScope;
          route.scrollTop = 0;
          route.tableScrollTop = 0;
          renderNavigationModal();
        }));
        restoreRoutePosition(route);
        window.scrollTo({ top:state.modalBaseScroll, behavior:"auto" });
        if (options.focusPrimary) (state.modalStack.length > 1 ? root.querySelector(".modal-back") : root.querySelector(".modal-close"))?.focus({ preventScroll:true });
      }

      function openMonthModal(key, opener) {
        closeNavigationModal({ restoreFocus:false });
        const route = {
          kind:"month",
          key,
          label:monthLabel(`${key}-01`),
          loading:true,
          error:null,
          data:null,
          sort:{ key:"date", direction:"asc" }
        };
        pushModalRoute(route, opener);
        loadMonthData(key).then(data => {
          route.data = data;
          route.loading = false;
          if (currentRoute() === route) renderNavigationModal();
        }).catch(() => {
          route.loading = false;
          route.error = true;
          if (currentRoute() === route) renderNavigationModal();
        });
      }

      function openDayFromMonth(di) {
        const parent = currentRoute();
        if (parent?.kind !== "month" || !parent.data) return;
        pushModalRoute({
          kind:"day",
          di,
          contextRows:parent.data.contextRows,
          sort:{ key:"label", direction:"asc" },
          search:""
        });
      }

      function openCampaignModal(id, opener, options = {}) {
        const parent = currentRoute();
        const parentRows = parent?.kind === "day" ? parent.contextRows : parent?.data?.contextRows;
        const fallback = (parentRows || state.data?.daily || []).filter(row => Number(row.campaign_id) === Number(id));
        const route = {
          kind:"campaign",
          id,
          scope:options.scope || "panel",
          anchorDi:options.anchorDi ?? null,
          rows:fallback.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))),
          loading:true,
          error:null,
          sort:{ key:"date", direction:"asc" }
        };
        pushModalRoute(route, opener);
        loadCampaignData(id).then(rows => {
          route.rows = rows;
          route.loading = false;
          if (currentRoute() === route) renderNavigationModal();
        }).catch(() => {
          route.loading = false;
          route.error = true;
          if (currentRoute() === route) renderNavigationModal();
        });
      }

      async function enrichDashboard(first, last, requestId) {
        const results = await Promise.allSettled([
          rpc("campaign_ranking", { di_ini:first, di_fim:last, min_spend:150, roi_meta:20, exclude_prefix:null }),
          rpc("operational_alerts", { di_ini:first, di_fim:last, min_spend:150, roi_meta:20 }),
          rpc("data_quality_status", { di_ini:first, di_fim:last })
        ]);
        if (requestId !== state.loadId || !state.data) return;

        const [rankingResult, alertsResult, qualityResult] = results;
        const current = state.data;
        const ranking = rankingResult.status === "fulfilled" && Array.isArray(rankingResult.value) ? rankingResult.value : current.ranking;
        const serverAlerts = alertsResult.status === "fulfilled" && Array.isArray(alertsResult.value) ? alertsResult.value : [];
        const alertsByKey = new Map([...(current.clientAlerts || []), ...serverAlerts].map(alert => [`${alert.campaign_id}:${alert.tipo}`, alert]));
        const quality = qualityResult.status === "fulfilled" && qualityResult.value && typeof qualityResult.value === "object" ? { ...current.quality, ...qualityResult.value } : current.quality;
        state.data = { ...current, ranking, alerts:[...alertsByKey.values()], quality };
        state.insightsUnavailable = results.some(result => result.status === "rejected");
        render({ preserveScroll:true });
      }

      async function load(options = {}) {
        const active = selectedDays();
        if (!active.length) {
          ++state.loadId;
          state.insightsUnavailable = false;
          state.data = deriveDashboard([]);
          render(options);
          return;
        }

        const first = active[0].di;
        const last = active.at(-1).di;
        const requestId = ++state.loadId;
        state.data = null;
        state.insightsUnavailable = false;
        render(options);

        try {
          const daily = await apiAll(`v_daily?typ=eq.msgs&date=gte.${state.start}&date=lte.${state.end}&select=${DAILY_FIELDS}&order=date.asc,campaign_id.asc`);
          if (requestId !== state.loadId) return;
          state.data = deriveDashboard(daily);
          render({ preserveScroll:Boolean(options.preserveScroll) });
          void enrichDashboard(first, last, requestId);
        } catch {
          if (requestId !== state.loadId) return;
          APP.innerHTML = '<section class="message"><h2>Não foi possível atualizar o painel</h2><p>Verifique a conexão com a base de dados e tente novamente.</p><button class="retry" id="retry">Tentar novamente</button></section>';
          document.getElementById("retry").addEventListener("click", start);
        }
      }

      async function start() {
        closeNavigationModal({ restoreFocus:false });
        try {
          state.days = await api("days?select=di,date,label,badge&order=di.asc");
          ensureInitialPeriod();
          syncHash();
          await load();
        } catch {
          APP.innerHTML = '<section class="message"><h2>Não foi possível iniciar o painel</h2><p>Verifique a conexão com a base de dados e tente novamente.</p><button class="retry" id="retry">Tentar novamente</button></section>';
          document.getElementById("retry").addEventListener("click", start);
        }
      }

      window.addEventListener("hashchange", () => {
        const next = readHash();
        if (next.range === state.range && next.start === state.start && next.end === state.end) return;
        state.range = next.range;
        state.start = next.start;
        state.end = next.end;
        state.preset = next.preset;
        ensureInitialPeriod();
        if (state.days.length) load({ preserveScroll:true });
      });

      start();
    </script>
  </body>
</html>
